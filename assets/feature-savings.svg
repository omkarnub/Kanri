<svg width="72" height="72" viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <!-- Coin at top dropping into slot -->
  <rect x="32" y="8" width="8" height="12" fill="#F59E0B"/>
  <rect x="34" y="10" width="4" height="8" fill="#FDE68A"/>
  
  <!-- Piggy bank snout / ears -->
  <rect x="20" y="24" width="8" height="8" fill="#30A46C"/>
  <rect x="44" y="24" width="8" height="8" fill="#30A46C"/>
  
  <!-- Main Piggy body -->
  <rect x="16" y="28" width="40" height="28" fill="#10B981"/>
  <rect x="20" y="32" width="32" height="20" fill="#34D399"/>
  
  <!-- Coin slot -->
  <rect x="30" y="28" width="12" height="4" fill="#065F46"/>
  
  <!-- Eyes -->
  <rect x="24" y="36" width="4" height="4" fill="#064E3B"/>
  <rect x="44" y="36" width="4" height="4" fill="#064E3B"/>
  
  <!-- Snout -->
  <rect x="30" y="40" width="12" height="8" fill="#6EE7B7"/>
  <rect x="32" y="42" width="2" height="4" fill="#064E3B"/>
  <rect x="38" y="42" width="2" height="4" fill="#064E3B"/>
  
  <!-- Feet -->
  <rect x="20" y="56" width="8" height="6" fill="#059669"/>
  <rect x="44" y="56" width="8" height="6" fill="#059669"/>
  
  <!-- Sparkles -->
  <rect x="10" y="22" width="4" height="4" fill="#FDE68A"/>
  <rect x="58" y="22" width="4" height="4" fill="#FDE68A"/>
</svg>
