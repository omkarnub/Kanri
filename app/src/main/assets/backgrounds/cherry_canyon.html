<script>
(function() {
  const DEG = Math.PI / 180;
  const CAM_H = 1.0;
  const REF_H = 0.514; // Exact waterfall horizon line in the 9:16 reference image
  const CLOUD_D = 42.0;
  const STRIDE = 14;

  // 3D Voxel overlay kinds
  const K_CLOUD = 3;
  const K_PETAL = 7;
  const K_FIREFLY = 8;

  const clamp = (v, a, b) => Math.min(b, Math.max(a, Number.isFinite(v) ? v : a));
  const mix = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

  function hex(s) {
    const n = parseInt(s.slice(1), 16);
    return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255];
  }

  function smoothstep(a, b, x) {
    const t = clamp((x - a) / (b - a), 0, 1);
    return t * t * (3 - 2 * t);
  }

  function mulberry32(a) {
    return () => {
      a |= 0;
      a = a + 1831565813 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  // Complete 24-Hour Day Cycle Keyframes (00:00 -> 24:00)
  // Covering Midnight -> Dawn -> Golden Sunrise (1:1 Reference Image at 06:25) -> Morning -> High Noon -> Afternoon -> Golden Hour -> Fiery Sunset -> Violet Dusk -> Indigo Twilight -> Starry Night
  const SKY_KEYFRAMES = [
    { hour: 0.0,  name: "Starry Midnight", top: hex("#040714"), hor: hex("#101A3C"), glow: hex("#8CA6EC"), light: [0.22, 0.28, 0.48], clouds: [0.24, 0.30, 0.46], sunrise: 0.0,  day: 0.0,  sunset: 0.0,  dusk: 0.0,  night: 1.0 },
    { hour: 4.2,  name: "Deep Night",      top: hex("#070C22"), hor: hex("#18224A"), glow: hex("#94AEF0"), light: [0.26, 0.32, 0.52], clouds: [0.28, 0.34, 0.50], sunrise: 0.0,  day: 0.0,  sunset: 0.0,  dusk: 0.15, night: 0.88 },
    { hour: 5.1,  name: "Early Dawn",      top: hex("#423358"), hor: hex("#B86E7A"), glow: hex("#F8B698"), light: [0.72, 0.60, 0.66], clouds: [0.78, 0.64, 0.70], sunrise: 0.38, day: 0.0,  sunset: 0.25, dusk: 0.42, night: 0.22 },
    // 06:25 AM (hour 6.42) — Exact 1:1 Reference Image State
    { hour: 6.42, name: "Golden Sunrise",  top: hex("#909AB6"), hor: hex("#F5DFD4"), glow: hex("#FFFDF0"), light: [1.00, 1.00, 1.00], clouds: [1.04, 0.94, 0.94], sunrise: 1.0,  day: 0.0,  sunset: 0.0,  dusk: 0.0,  night: 0.0 },
    { hour: 7.8,  name: "Rose Morning",    top: hex("#6A8CC4"), hor: hex("#DCE2EE"), glow: hex("#FFF8E6"), light: [1.04, 1.03, 1.02], clouds: [1.04, 0.98, 0.98], sunrise: 0.55, day: 0.45, sunset: 0.0,  dusk: 0.0,  night: 0.0 },
    { hour: 9.2,  name: "Crisp Morning",   top: hex("#3E82DC"), hor: hex("#B4D6F6"), glow: hex("#FFF9EC"), light: [1.08, 1.08, 1.08], clouds: [1.04, 1.04, 1.04], sunrise: 0.12, day: 0.88, sunset: 0.0,  dusk: 0.0,  night: 0.0 },
    { hour: 12.5, name: "High Noon",       top: hex("#2463EB"), hor: hex("#A4D2FA"), glow: hex("#FFFFFF"), light: [1.14, 1.14, 1.14], clouds: [1.05, 1.05, 1.05], sunrise: 0.0,  day: 1.0,  sunset: 0.0,  dusk: 0.0,  night: 0.0 },
    { hour: 15.2, name: "Afternoon Sun",   top: hex("#3474D4"), hor: hex("#B2D8F8"), glow: hex("#FFFCEE"), light: [1.10, 1.10, 1.08], clouds: [1.04, 1.02, 1.00], sunrise: 0.15, day: 0.85, sunset: 0.0,  dusk: 0.0,  night: 0.0 },
    { hour: 16.8, name: "Golden Hour",     top: hex("#6874B2"), hor: hex("#F2B892"), glow: hex("#FFE2A8"), light: [1.10, 0.96, 0.88], clouds: [1.10, 0.92, 0.84], sunrise: 0.45, day: 0.15, sunset: 0.55, dusk: 0.0,  night: 0.0 },
    { hour: 17.85,name: "Fiery Sunset",    top: hex("#783868"), hor: hex("#FA7A48"), glow: hex("#FFC466"), light: [1.14, 0.82, 0.68], clouds: [1.15, 0.80, 0.68], sunrise: 0.0,  day: 0.0,  sunset: 1.0,  dusk: 0.0,  night: 0.0 },
    { hour: 18.8, name: "Crimson Sunset",  top: hex("#582B5C"), hor: hex("#E05254"), glow: hex("#FF9452"), light: [0.95, 0.66, 0.66], clouds: [0.98, 0.66, 0.68], sunrise: 0.0,  day: 0.0,  sunset: 0.72, dusk: 0.35, night: 0.10 },
    { hour: 19.8, name: "Violet Dusk",     top: hex("#281D4A"), hor: hex("#864276"), glow: hex("#D896E0"), light: [0.58, 0.46, 0.68], clouds: [0.60, 0.48, 0.70], sunrise: 0.0,  day: 0.0,  sunset: 0.15, dusk: 0.85, night: 0.42 },
    { hour: 21.0, name: "Indigo Twilight", top: hex("#111332"), hor: hex("#282962"), glow: hex("#948AE8"), light: [0.34, 0.36, 0.56], clouds: [0.36, 0.38, 0.58], sunrise: 0.0,  day: 0.0,  sunset: 0.0,  dusk: 0.30, night: 0.82 },
    { hour: 22.2, name: "Starry Night",    top: hex("#040714"), hor: hex("#101A3C"), glow: hex("#8CA6EC"), light: [0.22, 0.28, 0.48], clouds: [0.24, 0.30, 0.46], sunrise: 0.0,  day: 0.0,  sunset: 0.0,  dusk: 0.0,  night: 1.0 },
    { hour: 24.0, name: "Starry Midnight", top: hex("#040714"), hor: hex("#101A3C"), glow: hex("#8CA6EC"), light: [0.22, 0.28, 0.48], clouds: [0.24, 0.30, 0.46], sunrise: 0.0,  day: 0.0,  sunset: 0.0,  dusk: 0.0,  night: 1.0 }
  ];

  function lerpCol(a, b, t) {
    return [
      a[0] + (b[0] - a[0]) * t,
      a[1] + (b[1] - a[1]) * t,
      a[2] + (b[2] - a[2]) * t
    ];
  }
  function lerpVal(a, b, t) {
    return a + (b - a) * t;
  }

  function getSkyEnvironment(h) {
    const wrappedH = ((h % 24) + 24) % 24;
    let i = 0;
    while (i < SKY_KEYFRAMES.length - 1 && SKY_KEYFRAMES[i + 1].hour < wrappedH) {
      i++;
    }
    const k1 = SKY_KEYFRAMES[i];
    const k2 = SKY_KEYFRAMES[Math.min(i + 1, SKY_KEYFRAMES.length - 1)];
    const span = k2.hour - k1.hour;
    const rawT = span > 0 ? (wrappedH - k1.hour) / span : 0;
    const t = clamp(rawT, 0, 1);
    const easeT = 0.5 - 0.5 * Math.cos(t * Math.PI);

    return {
      stageName: rawT < 0.5 ? k1.name : k2.name,
      top: lerpCol(k1.top, k2.top, easeT),
      hor: lerpCol(k1.hor, k2.hor, easeT),
      glow: lerpCol(k1.glow, k2.glow, easeT),
      light: lerpCol(k1.light, k2.light, easeT),
      clouds: lerpCol(k1.clouds, k2.clouds, easeT),
      sunrise: lerpVal(k1.sunrise, k2.sunrise, easeT),
      day: lerpVal(k1.day, k2.day, easeT),
      sunset: lerpVal(k1.sunset, k2.sunset, easeT),
      dusk: lerpVal(k1.dusk, k2.dusk, easeT),
      night: lerpVal(k1.night, k2.night, easeT)
    };
  }

  function dayAt(hour) {
    const th = (hour - 6) / 24 * Math.PI * 2;
    const e = Math.sin(th);
    const env = getSkyEnvironment(hour);
    return { th, e, ...env };
  }

  function vfovFor(aspect) {
    const t = clamp((aspect - 0.55) / 1.4, 0, 1);
    return 52 - 14 * t * t * (3 - 2 * t);
  }

  function put(o, cx, cy, cz, sx, sy, sz, c, tip, rx, rz, h, kind) {
    o.push(cx, cy, cz, sx, sy, sz, c[0], c[1], c[2], tip, rx, rz, h, kind);
  }

  // Build 3D Voxel Particles (Drifting Voxel Clouds, Spiraling Sakura Petals & Glowing Dusk/Night Fireflies)
  function buildOverlayVoxels(W, H, seedVal) {
    const rnd = mulberry32(seedVal * 9973 + 17);
    const aspect = W / H;
    const h = REF_H;
    const f = 0.5 / Math.tan(vfovFor(aspect) * DEG / 2);
    const wx = (u, d) => (u - 0.5) * aspect / f * d;
    const halfW = (d) => aspect / 2 / f * d;
    const heightAt = (v, d) => CAM_H - (v - h) / f * d;
    const len = (s, d) => s / f * d;

    const clouds = [];
    const particles = [];

    // 1. Drifting 3D Voxel Clouds in upper sky
    const cloudDefs = [
      { ax: 0.78, ay: 0.085, w: 0.22, h: 0.018 },
      { ax: 0.62, ay: 0.145, w: 0.17, h: 0.015 },
      { ax: 0.88, ay: 0.175, w: 0.15, h: 0.013 }
    ];
    let cloudWide = 0;
    for (const cd of cloudDefs) {
      const dc = CLOUD_D;
      const span = len(cd.w, dc);
      cloudWide = Math.max(cloudWide, span);
      const mid = wx(cd.ax, dc);
      const rate = 0.85 + rnd() * 0.3;
      for (let b = 0; b < 4; b++) {
        const bu0 = cd.ax - cd.w * 0.5 + b * (cd.w * 0.22);
        const bu1 = bu0 + cd.w * (0.35 + rnd() * 0.15);
        const bv0 = cd.ay - cd.h * (b === 1 || b === 2 ? 0.9 : 0.4);
        const bv1 = cd.ay + cd.h * 0.5;
        const xa = wx(bu0, dc), xb = wx(bu1, dc);
        const yt = heightAt(bv0, dc), yb = heightAt(bv1, dc);
        const dz = span * 0.35;
        put(clouds, (xa + xb) * 0.5, (yt + yb) * 0.5, -dc - dz * 0.5, Math.abs(xb - xa), Math.abs(yt - yb), dz, hex("#F8ECEF"), 0, mid, rate, 0, K_CLOUD);
      }
    }

    // 2. Spiraling Falling Cherry Blossom Voxel Petals
    const sakuraSoft = hex("#F298AE");
    const sakuraCream = hex("#FFE8EE");
    const sakuraCoral = hex("#E8647C");
    for (let i = 0; i < 72; i++) {
      const d = 6.5 + rnd() * 16.0;
      const u = 0.04 + rnd() * 0.92;
      const v = 0.18 + rnd() * 0.68;
      const s = len(0.0042 + rnd() * 0.0036, d);
      const cBase = rnd() < 0.3 ? sakuraCoral : sakuraSoft;
      const col = mix(cBase, sakuraCream, rnd() * 0.75);
      const phase = rnd() * 6.283;
      const speed = 0.55 + rnd() * 0.75;
      put(particles, wx(u, d), heightAt(v, d), -d, s, s * 0.55, s, col, 0.9, phase, speed, len(0.26, d), K_PETAL);
    }

    // 3. Dusk & Night Glowing Voxel Fireflies hovering over the river & around the cherry tree
    const ffGold = hex("#FFE875");
    const ffAmber = hex("#FFA640");
    for (let i = 0; i < 48; i++) {
      const d = 6.0 + rnd() * 18.0;
      const u = 0.06 + rnd() * 0.88;
      const v = 0.28 + rnd() * 0.64;
      const s = len(0.0050 + rnd() * 0.0035, d);

    g.setAttribute("position", base.getAttribute("position").clone());
    g.setAttribute("normal", base.getAttribute("normal").clone());
    const idx = base.getIndex().array;
    const sub = [];
    for (const face of faces) {
      for (let i = 0; i < 6; i++) sub.push(idx[face * 6 + i]);
    }
    g.setIndex(sub);
    const ib = new THREE.InstancedInterleavedBuffer(new Float32Array(data), STRIDE);
    g.setAttribute("aCenter", new THREE.InterleavedBufferAttribute(ib, 3, 0));
    g.setAttribute("aSize", new THREE.InterleavedBufferAttribute(ib, 3, 3));
    g.setAttribute("aColor", new THREE.InterleavedBufferAttribute(ib, 4, 6));
    g.setAttribute("aBend", new THREE.InterleavedBufferAttribute(ib, 4, 10));
    g.instanceCount = data.length / STRIDE;
    return g;
  }

  const setV = (u, c) => u.value.set(c[0], c[1], c[2]);

  function formatClock(h) {
    const wrapped = ((h % 24) + 24) % 24;
    const hrs = Math.floor(wrapped);
    const mins = Math.floor((wrapped - hrs) * 60);
    return String(hrs).padStart(2, "0") + ":" + String(mins).padStart(2, "0");
  }

  const state = {
    hour: 6.42,           // Starts at Golden Sunrise (06:25 AM) — exact 1:1 match to reference image
    cycleDuration: 60,    // Seconds per full 24h cycle (60s / 30s / 120s)
    fullbleed: false,
    seed: 7,
    wind: 7.5
  };

  function init() {
    const host = document.getElementById("host");
    const canvas = document.getElementById("stage");
    const backdrop = document.getElementById("backdrop");
    const refImg = document.getElementById("refImage");
    if (!host || !canvas || !refImg) return;

    let renderer;
    try {
      renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false, powerPreference: "high-performance" });
    } catch {
      return;
    }
    renderer.autoClear = false;

    const camera = new THREE.PerspectiveCamera(50, 9 / 16, 0.05, 8e3);
    camera.position.set(0, CAM_H, 0);
    const screenCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);

    // Load the 1:1 Reference Image Texture
    const photoTex = new THREE.Texture(refImg);
    photoTex.minFilter = THREE.LinearFilter;
    photoTex.magFilter = THREE.LinearFilter;
    photoTex.wrapS = THREE.ClampToEdgeWrapping;
    photoTex.wrapT = THREE.ClampToEdgeWrapping;
    if (refImg.complete && refImg.naturalWidth > 0) {
      photoTex.needsUpdate = true;
    } else {
      refImg.addEventListener("load", () => {
        photoTex.needsUpdate = true;
      });
    }

    const skyRT = new THREE.WebGLRenderTarget(1, 1, {
      depthBuffer: true,
      type: THREE.UnsignedByteType
    });

    const shared = {
      uTime: { value: 0 },
      uWind: { value: 1 },
      uAspect: { value: 9 / 16 },
      uTop: { value: new THREE.Vector3() },
      uHor: { value: new THREE.Vector3() },
      uGlow: { value: new THREE.Vector3() },
      uLight: { value: new THREE.Vector3(1, 1, 1) },
      uSunrise: { value: 1 },
      uDay: { value: 0 },
      uSunset: { value: 0 },
      uDusk: { value: 0 },
      uNight: { value: 0 },
      uSunPos: { value: new THREE.Vector2() },
      uSunK: { value: 1 },
      uMoonPos: { value: new THREE.Vector2() },
      uMoonK: { value: 0 }
    };

    const skyMat = new THREE.ShaderMaterial({
      vertexShader: SCREEN_VERT,
      fragmentShader: SKY_FRAG,
      depthTest: false,
      depthWrite: false,
      uniforms: {
        ...shared,
        uClock: { value: 0 },
        uHy: { value: REF_H },
        uSun: { value: new THREE.Vector3(1.0, 0.99, 0.95) },
        uSunSize: { value: 0.056 }
      }
    });

    const voxelMat = new THREE.ShaderMaterial({
      vertexShader: VOXEL_VERT,
      fragmentShader: VOXEL_FRAG,
      transparent: true,
      premultipliedAlpha: true,
      depthWrite: false,
      uniforms: {
        ...shared,
        uCloudShift: { value: 0 },
        uCloudWrap: { value: 100 },
        uCloudLight: { value: new THREE.Vector3(1, 1, 1) },
        uCloudWhite: { value: 0 }
      }
    });

    const canyonMat = new THREE.ShaderMaterial({
      vertexShader: SCREEN_VERT,
      fragmentShader: CANYON_FRAG,
      depthTest: false,
      depthWrite: false,
      uniforms: {
        ...shared,
        uPhoto: { value: photoTex },
        uSkyRT: { value: skyRT.texture }
      }
    });

    const postMat = new THREE.ShaderMaterial({
      vertexShader: SCREEN_VERT,
      fragmentShader: POST_FRAG,
      depthTest: false,
      depthWrite: false,
      transparent: true,
      premultipliedAlpha: true,
      uniforms: {
        uAspect: shared.uAspect,
        uGlow: shared.uGlow,
        uHy: skyMat.uniforms.uHy,
        uSunPos: shared.uSunPos,
        uMoonPos: shared.uMoonPos,
        uMoonK: shared.uMoonK,
        uGlowK: { value: 1 }
      }
    });

    const tri = new THREE.BufferGeometry();
    tri.setAttribute("position", new THREE.Float32BufferAttribute([-1, -1, 0, 3, -1, 0, -1, 3, 0], 3));

    const skyScene = new THREE.Scene();
    const skyQuad = new THREE.Mesh(tri, skyMat);
    skyQuad.frustumCulled = false;
    skyQuad.renderOrder = -1;
    skyScene.add(skyQuad);

    const canyonScene = new THREE.Scene();
    const canyonQuad = new THREE.Mesh(tri, canyonMat);
    canyonQuad.frustumCulled = false;
    canyonScene.add(canyonQuad);

    const particleScene = new THREE.Scene();

    const postScene = new THREE.Scene();
    const postQuad = new THREE.Mesh(tri, postMat);
    postQuad.frustumCulled = false;
    postScene.add(postQuad);

    const box = new THREE.BoxGeometry(1, 1, 1);
    let cloudMesh = null;
    let particleMesh = null;

    let W = 0;
    let H = 0;
    let dpr = 1;
    const resize = () => {
      W = host.clientWidth;
      H = host.clientHeight;
      dpr = Math.min(2, window.devicePixelRatio || 1);
      if (W < 2 || H < 2) return;
      renderer.setPixelRatio(dpr);
      renderer.setSize(W, H, false);
      const fw = Math.round(W * dpr);
      const fh = Math.round(H * dpr);
      skyRT.setSize(fw, fh);
    };
    resize();

    const ro = typeof ResizeObserver !== "undefined" ? new ResizeObserver(resize) : null;
    ro?.observe(host);

    let builtKey = "";
    let builtAt = -1e9;
    let built = { aspect: 9 / 16, h: REF_H, cloudHalf: 1, cloudWrap: 100 };

    const rebuild = (key, now) => {
      const b = buildOverlayVoxels(W, H, state.seed);
      if (cloudMesh) {
        cloudMesh.removeFromParent();
        cloudMesh.geometry.dispose();
      }
      if (particleMesh) {
        particleMesh.removeFromParent();
        particleMesh.geometry.dispose();
      }
      cloudMesh = new THREE.Mesh(instanced(box, FACES_ALL, b.clouds), voxelMat);
      particleMesh = new THREE.Mesh(instanced(box, FACES_ALL, b.particles), voxelMat);
      cloudMesh.frustumCulled = false;
      particleMesh.frustumCulled = false;
      skyScene.add(cloudMesh);
      particleScene.add(particleMesh);
      built = { aspect: W / H, h: REF_H, cloudHalf: b.cloudHalf, cloudWrap: b.cloudWrap };
      builtKey = key;
      builtAt = now;
    };

    let time = 0;
    let clock = 0;
    let cloudShift = 0;
    let last = -1;

    const frame = (now) => {
      requestAnimationFrame(frame);
      const dt = last < 0 ? 0 : Math.min(0.05, (now - last) / 1e3);
      last = now;
      if (W < 2 || H < 2) return;

      const key = [W, H, state.seed].join("|");
      if (key !== builtKey && (builtKey === "" || now - builtAt > 160)) rebuild(key, now);

      const aspect = W / H;
      const h = built.h;
      camera.fov = vfovFor(built.aspect);
      camera.aspect = aspect;
      camera.setViewOffset(W, H, 0, (0.5 - h) * H, W, H);
      camera.updateProjectionMatrix();

      time += dt * 1.4;
      clock += dt;
      cloudShift += 0.016 * built.cloudHalf * dt;

      const nowTime = new Date(); state.hour = nowTime.getHours() + nowTime.getMinutes() / 60 + nowTime.getSeconds() / 3600;

      const D = dayAt(state.hour);

      const topHex = `rgb(${Math.round(D.top[0]*170)}, ${Math.round(D.top[1]*170)}, ${Math.round(D.top[2]*170)})`;
      const horHex = `rgb(${Math.round(D.hor[0]*115)}, ${Math.round(D.hor[1]*115)}, ${Math.round(D.hor[2]*115)})`;
      backdrop.style.background = `radial-gradient(circle at 50% 42%, ${horHex} 0%, ${topHex} 55%, #09060d 100%)`;

      // Sun & Moon trajectories across the 9:16 canyon sky
      const baseY = h - 0.055;
      const arc = 0.24;
      const reach = aspect * 0.34;
      const sun = [aspect * 0.46 - Math.cos(D.th) * reach, baseY - Math.sin(D.th) * arc];
      const moon = [aspect * 0.54 + Math.cos(D.th) * reach * 0.82, baseY + Math.sin(D.th) * arc * 0.88];

      const sunUp = smoothstep(-0.14, 0.04, D.e);
      const moonUp = smoothstep(0.04, 0.22, -D.e);

      shared.uTime.value = time;
      shared.uWind.value = clamp(state.wind, 0, 10) / 5;
      shared.uAspect.value = aspect;
      setV(shared.uTop, D.top);
      setV(shared.uHor, D.hor);
      setV(shared.uGlow, D.glow);
      setV(shared.uLight, D.light);
      shared.uSunrise.value = D.sunrise;
      shared.uDay.value = D.day;
      shared.uSunset.value = D.sunset;
      shared.uDusk.value = D.dusk;
      shared.uNight.value = D.night;
      shared.uSunPos.value.set(sun[0], sun[1]);
      shared.uMoonPos.value.set(moon[0], moon[1]);
      shared.uSunK.value = sunUp * (1.0 - 0.28 * D.day);
      shared.uMoonK.value = moonUp;

      skyMat.uniforms.uClock.value = clock;
      voxelMat.uniforms.uCloudShift.value = cloudShift;
      voxelMat.uniforms.uCloudWrap.value = built.cloudWrap;
      setV(voxelMat.uniforms.uCloudLight, D.clouds);
      voxelMat.uniforms.uCloudWhite.value = D.day * 0.8 + D.night * 0.55;

      postMat.uniforms.uGlowK.value = (0.92 + 0.08 * Math.cos(time * 0.8)) * sunUp * (1.0 - 0.5 * D.day);

      // Pass 1: Render 24-Hour Sky + Sun + Moon + Stars + 3D Voxel Clouds into skyRT
      renderer.setRenderTarget(skyRT);
      renderer.setClearColor(0, 1);
      renderer.clear();
      renderer.render(skyScene, camera);

      // Pass 2: Render 1:1 Animated & Relit Canyon Scene composited over skyRT
      renderer.setRenderTarget(null);
      renderer.setClearColor(0, 1);
      renderer.clear();
      renderer.render(canyonScene, screenCam);

      // Pass 3: Render 3D Falling Sakura Petals & Dusk/Night Glowing Fireflies
      renderer.clearDepth();
      renderer.render(particleScene, camera);

      // Pass 4: Atmospheric Sun/Moon Bloom & Subtle Vignette
      renderer.render(postScene, screenCam);
    };

    requestAnimationFrame(frame);
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
