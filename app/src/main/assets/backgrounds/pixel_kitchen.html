  <title>9:16 Pixel Art Kitchen — 24-Hour Loop</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #080a0f;
      pointer-events: none;
    }
    #ambientBackdrop {
      position: fixed;
      inset: -10%;
      background: radial-gradient(
        circle at 50% 42%,
        rgba(var(--glow-r), var(--glow-g), var(--glow-b), 0.36) 0%,
        rgba(var(--glow-r), var(--glow-g), var(--glow-b), 0.14) 45%,
        rgba(8, 10, 15, 0.96) 80%
      );
      filter: blur(48px);
      pointer-events: none;
      z-index: 0;
      transition: background 0.3s ease;
    }
    #stageWrapper {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
      pointer-events: none;
    }
    #frameContainer {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0d111a;
      pointer-events: none;
    }
    #displayCanvas {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
      pointer-events: none;
    }
</style>
</head>

      const outBuf = outImgData.data;

      

      const state = {
        ready: false,
        hour: 8.5,            // Starts at Sunny Morning (08:30) and loops continuously through all 24 hours
        origLoopSec: 0.0,     // 0.0 .. 20.0s continuous animation clock
        soundEnabled: false
      };

      let tileAmb = null;
      const keyframes = [];
      const extMask = new Float32Array(NUM_PIXELS);
      const cottageWinMask = new Float32Array(NUM_PIXELS);
      const lampMask = new Float32Array(NUM_PIXELS);
      const skyCanopyMask = new Float32Array(NUM_PIXELS);

      const steamParticles = [];
      const dustParticles = [];
      const fireflies = [];
      const stars = [];

      function initParticles() {
        for (let i = 0; i < 18; i++) {
          steamParticles.push({
            x: 25 + (Math.random() - 0.5) * 5,
            y: 200 - Math.random() * 26,
            vx: (Math.random() - 0.5) * 0.15,
            vy: -0.22 - Math.random() * 0.18,
            life: Math.random(),
            phase: Math.random() * Math.PI * 2
          });
        }
        for (let i = 0; i < 42; i++) {
          dustParticles.push({
            x: 8 + Math.random() * 164,
            y: 20 + Math.random() * 285,
            vx: (Math.random() - 0.5) * 0.12,
            vy: -0.05 + (Math.random() - 0.5) * 0.08,
            phase: Math.random() * Math.PI * 2
          });
        }
        for (let i = 0; i < 16; i++) {
          fireflies.push({
            x: 3 + Math.random() * 78,
            y: 45 + Math.random() * 105,
            vx: (Math.random() - 0.5) * 0.18,
            vy: (Math.random() - 0.5) * 0.14,
            phase: Math.random() * Math.PI * 2
          });
        }
        const starCoords = [
          [5, 4], [12, 8], [28, 5], [31, 14], [47, 6], [54, 11],
          [66, 4], [74, 9], [80, 15], [18, 12], [61, 14], [9, 19]
        ];
        for (let i = 0; i < starCoords.length; i++) {
          stars.push({
            x: starCoords[i][0],
            y: starCoords[i][1],
            phase: i * 1.7
          });
        }
      }

      initParticles();

      const spriteImg = new Image();
      spriteImg.onload = function() {
        const tmpC = document.createElement('canvas');
        tmpC.width = PW * 8;
        tmpC.height = PH * 4;
        const tmpCtx = tmpC.getContext('2d');
        tmpCtx.drawImage(spriteImg, 0, 0);

        for (let k = 0; k < 32; k++) {
          const r = Math.floor(k / 8);
          const c = k % 8;
          const imgD = tmpCtx.getImageData(c * PW, r * PH, PW, PH);
          if (k === 0) {
            tileAmb = new Uint8ClampedArray(imgD.data);
          } else {
            keyframes.push(new Uint8ClampedArray(imgD.data));
          }
        }

        for (let y = 0; y < PH; y++) {
          for (let x = 0; x < PW; x++) {
            const idx = y * PW + x;
            const p4 = idx * 4;
            const ar = tileAmb[p4];
            const ag = tileAmb[p4 + 1];
            const ab = tileAmb[p4 + 2];
            const luma = 0.299 * ar + 0.587 * ag + 0.114 * ab;

            let isExt = 0.0;
            if (x >= 0 && x <= 33) {
              if (y >= 0 && y <= 61) isExt = 1.0;
              else if (y >= 69 && y <= Math.floor(155 - (x / 33.0) * 7)) isExt = 1.0;
            } else if (x >= 43 && x <= 83) {
              if (y >= 0 && y <= 55) isExt = 1.0;
              else if (y >= 62 && y <= Math.floor(141 - ((x - 43) / 40.0) * 10)) isExt = 1.0;
            }
            extMask[idx] = isExt;

            if (isExt > 0.5 && y >= 27 && y <= 37 && ((x >= 19 && x <= 25) || (x >= 46 && x <= 52))) {
              const wMask = Math.max(0.0, Math.min(1.0, (luma - 50.0) / 26.0));
              cottageWinMask[idx] = wMask;
            }

            if (isExt > 0.5 && y < 22 && luma > 42) {
              skyCanopyMask[idx] = 1.0;
            }

            if (isExt < 0.5) {
              const dx = (x - 152) / 145.0;
              const dy = (y - 175) / 165.0;
              const dist = Math.sqrt(dx * dx + dy * dy);
              const falloff = Math.max(0.0, 1.0 - dist * 0.92);
              lampMask[idx] = falloff * falloff;
            }
          }
        }

        state.ready = true;
      };
      spriteImg.src = SPRITE_DATA_URI;

      const DAY_ANCHORS = [
        {
          hour: 0.0,
          extMult: [0.17, 0.25, 0.48], extBias: [-4, 0, 12],
          intMult: [0.21, 0.29, 0.52], intBias: [-2, 2, 10],
          beamMult: [0.19, 0.33, 0.65], beamBaseIdx: 14.0,
          cottageGlow: 0.85, autoLamp: 0.25, glowRGB: [40, 68, 130]
        },
        {
          hour: 4.25,
          extMult: [0.16, 0.22, 0.44], extBias: [-4, -1, 10],
          intMult: [0.19, 0.25, 0.46], intBias: [-2, 0, 8],
          beamMult: [0.14, 0.25, 0.52], beamBaseIdx: 24.0,
          cottageGlow: 0.45, autoLamp: 0.15, glowRGB: [35, 52, 110]
        },
        {
          hour: 5.5,
          extMult: [0.58, 0.52, 0.68], extBias: [12, 6, 18],
          intMult: [0.54, 0.48, 0.62], intBias: [8, 4, 12],
          beamMult: [0.42, 0.30, 0.40], beamBaseIdx: 1.0,
          cottageGlow: 0.20, autoLamp: 0.0, glowRGB: [145, 115, 160]
        },
        {
          hour: 7.0,
          extMult: [0.96, 0.82, 0.64], extBias: [10, 2, -8],
          intMult: [0.90, 0.76, 0.62], intBias: [6, 0, -4],
          beamMult: [1.22, 0.78, 0.42], beamBaseIdx: 4.0,
          cottageGlow: 0.0, autoLamp: 0.0, glowRGB: [245, 155, 85]
        },
        {
          hour: 8.75,
          extMult: [1.0, 1.0, 1.0], extBias: [0, 0, 0],
          intMult: [1.0, 1.0, 1.0], intBias: [0, 0, 0],
          beamMult: [1.0, 1.0, 1.0], beamBaseIdx: 8.0,
          cottageGlow: 0.0, autoLamp: 0.0, glowRGB: [225, 200, 140]
        },
        {
          hour: 10.5,
          extMult: [1.0, 1.0, 1.0], extBias: [0, 0, 0],
          intMult: [1.0, 1.0, 1.0], intBias: [0, 0, 0],
          beamMult: [1.0, 1.0, 1.0], beamBaseIdx: 22.0,
          cottageGlow: 0.0, autoLamp: 0.0, glowRGB: [225, 200, 140]
        },
        {
          hour: 12.75,
          extMult: [1.06, 1.07, 1.05], extBias: [6, 8, 6],
          intMult: [1.04, 1.05, 1.06], intBias: [5, 6, 8],
          beamMult: [1.06, 1.06, 1.04], beamBaseIdx: 15.0,
          cottageGlow: 0.0, autoLamp: 0.0, glowRGB: [235, 235, 195]
        },
        {
          hour: 15.5,
          extMult: [1.02, 0.95, 0.82], extBias: [8, 2, -6],
          intMult: [0.98, 0.90, 0.78], intBias: [6, 1, -4],
          beamMult: [1.14, 0.95, 0.72], beamBaseIdx: 23.0,
          cottageGlow: 0.0, autoLamp: 0.0, glowRGB: [240, 190, 115]
        },
        {
          hour: 18.0,
          extMult: [0.92, 0.60, 0.46], extBias: [16, -6, -12],
          intMult: [0.68, 0.48, 0.54], intBias: [6, -4, 4],
          beamMult: [1.38, 0.60, 0.23], beamBaseIdx: 28.0,
          cottageGlow: 0.35, autoLamp: 0.25, glowRGB: [235, 100, 55]
        },
        {
          hour: 19.75,
          extMult: [0.32, 0.40, 0.66], extBias: [-2, 4, 16],
          intMult: [0.36, 0.40, 0.58], intBias: [0, 2, 10],
          beamMult: [0.06, 0.09, 0.18], beamBaseIdx: 29.5,
          cottageGlow: 0.92, autoLamp: 0.75, glowRGB: [65, 85, 155]
        },
        {
          hour: 21.5,
          extMult: [0.20, 0.28, 0.52], extBias: [-3, 1, 14],
          intMult: [0.24, 0.31, 0.54], intBias: [-1, 2, 10],
          beamMult: [0.16, 0.28, 0.58], beamBaseIdx: 6.0,
          cottageGlow: 0.95, autoLamp: 0.55, glowRGB: [45, 70, 140]
        },
        {
          hour: 24.0,
          extMult: [0.17, 0.25, 0.48], extBias: [-4, 0, 12],
          intMult: [0.21, 0.29, 0.52], intBias: [-2, 2, 10],
          beamMult: [0.19, 0.33, 0.65], beamBaseIdx: 14.0,
          cottageGlow: 0.85, autoLamp: 0.25, glowRGB: [40, 68, 130]
        }
      ];

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function lerp3(a, b, t) {
        return [
          a[0] + (b[0] - a[0]) * t,
          a[1] + (b[1] - a[1]) * t,
          a[2] + (b[2] - a[2]) * t
        ];
      }

      function getCycleParams(hour) {
        const h = ((hour % 24) + 24) % 24;
        let i = 0;
        while (i < DAY_ANCHORS.length - 2 && h >= DAY_ANCHORS[i + 1].hour) {
          i++;
        }
        const a0 = DAY_ANCHORS[i];
        const a1 = DAY_ANCHORS[i + 1];
        const span = Math.max(0.0001, a1.hour - a0.hour);
        const rawT = Math.max(0.0, Math.min(1.0, (h - a0.hour) / span));
        const t = rawT * rawT * (3.0 - 2.0 * rawT);

        return {
          extMult: lerp3(a0.extMult, a1.extMult, t),
          extBias: lerp3(a0.extBias, a1.extBias, t),
          intMult: lerp3(a0.intMult, a1.intMult, t),
          intBias: lerp3(a0.intBias, a1.intBias, t),
          beamMult: lerp3(a0.beamMult, a1.beamMult, t),
          beamBaseIdx: lerp(a0.beamBaseIdx, a1.beamBaseIdx, rawT),
          cottageGlow: lerp(a0.cottageGlow, a1.cottageGlow, t),
          autoLamp: lerp(a0.autoLamp, a1.autoLamp, t),
          glowRGB: lerp3(a0.glowRGB, a1.glowRGB, t)
        };
      }

      function blendPixel(x, y, r, g, b, alpha) {
        const ix = Math.floor(x);
        const iy = Math.floor(y);
        if (ix < 0 || ix >= PW || iy < 0 || iy >= PH) return;
        const p4 = (iy * PW + ix) * 4;
        const inv = 1.0 - alpha;
        outBuf[p4]     = Math.min(255, Math.max(0, outBuf[p4] * inv + r * alpha));
        outBuf[p4 + 1] = Math.min(255, Math.max(0, outBuf[p4 + 1] * inv + g * alpha));
        outBuf[p4 + 2] = Math.min(255, Math.max(0, outBuf[p4 + 2] * inv + b * alpha));
      }

      function renderScene(dt, nowMs) {
        if (!state.ready || !tileAmb || keyframes.length < 31) return;

        // Advance continuous 24-hour loop & 20s animation clock
        state.origLoopSec = (state.origLoopSec + dt) % 20.0;
        const nowTime = new Date(); state.hour = nowTime.getHours() + nowTime.getMinutes() / 60 + nowTime.getSeconds() / 3600;

        const params = getCycleParams(state.hour);
        const extM = params.extMult;
        const extB = params.extBias;
        const intM = params.intMult;
        const intB = params.intBias;
        const beamM = params.beamMult;
        const cottageGlow = params.cottageGlow;
        const lampStrength = params.autoLamp;

        document.documentElement.style.setProperty('--glow-r', Math.round(params.glowRGB[0]));
        document.documentElement.style.setProperty('--glow-g', Math.round(params.glowRGB[1]));
        document.documentElement.style.setProperty('--glow-b', Math.round(params.glowRGB[2]));

        let u;
        if (state.hour >= 8.5 && state.hour <= 11.25) {
          const morningT = (state.hour - 8.5) / (11.25 - 8.5);
          u = morningT * 30.0;
        } else {
          const wave = Math.sin((state.origLoopSec / 20.0) * Math.PI * 2) * 3.2;
          u = Math.max(0.0, Math.min(30.0, params.beamBaseIdx + wave));
        }

        const k0 = Math.max(0, Math.min(30, Math.floor(u)));
        const k1 = Math.max(0, Math.min(30, k0 + 1));
        const frac = u - k0;
        const invFrac = 1.0 - frac;
        const frameA = keyframes[k0];
        const frameB = keyframes[k1];

        const extMR = extM[0], extMG = extM[1], extMB = extM[2];
        const extBR = extB[0], extBG = extB[1], extBB = extB[2];
        const intMR = intM[0], intMG = intM[1], intMB = intM[2];
        const intBR = intB[0], intBG = intB[1], intBB = intB[2];
        const bmR = beamM[0], bmG = beamM[1], bmB = beamM[2];

        for (let i = 0; i < NUM_PIXELS; i++) {
          const p4 = i * 4;
          const curR = frameA[p4]     * invFrac + frameB[p4]     * frac;
          const curG = frameA[p4 + 1] * invFrac + frameB[p4 + 1] * frac;
          const curB = frameA[p4 + 2] * invFrac + frameB[p4 + 2] * frac;

          const ambR = tileAmb[p4];
          const ambG = tileAmb[p4 + 1];
          const ambB = tileAmb[p4 + 2];

          const dirR = curR > ambR ? curR - ambR : 0.0;
          const dirG = curG > ambG ? curG - ambG : 0.0;
          const dirB = curB > ambB ? curB - ambB : 0.0;

          let r, g, b;
          if (extMask[i] > 0.5) {
            r = ambR * extMR + extBR + dirR * bmR * 0.72;
            g = ambG * extMG + extBG + dirG * bmG * 0.72;
            b = ambB * extMB + extBB + dirB * bmB * 0.72;

            const cw = cottageWinMask[i] * cottageGlow;
            if (cw > 0.01) {
              r = r * (1.0 - cw) + 255.0 * cw;
              g = g * (1.0 - cw) + 192.0 * cw;
              b = b * (1.0 - cw) + 88.0 * cw;
            }
          } else {
            r = ambR * intMR + intBR + dirR * bmR;
            g = ambG * intMG + intBG + dirG * bmG;
            b = ambB * intMB + intBB + dirB * bmB;

            if (lampStrength > 0.01) {
              const lm = lampMask[i] * lampStrength;
              r += lm * (58.0 + ambR * 0.35);
              g += lm * (32.0 + ambG * 0.18);
              b += lm * (8.0  + ambB * 0.04);
            }
          }

          outBuf[p4]     = r < 0 ? 0 : (r > 255 ? 255 : r);
          outBuf[p4 + 1] = g < 0 ? 0 : (g > 255 ? 255 : g);
          outBuf[p4 + 2] = b < 0 ? 0 : (b > 255 ? 255 : b);
          outBuf[p4 + 3] = 255;
        }

        const h = state.hour;
        const tSec = nowMs * 0.001;

        // 1. Rising Mug Steam
        for (let i = 0; i < steamParticles.length; i++) {
          const sp = steamParticles[i];
          sp.life += dt * 0.38;
          sp.y += sp.vy * (dt * 30.0);
          sp.x += Math.sin(tSec * 2.2 + sp.phase) * 0.09 * (dt * 30.0);
          if (sp.life >= 1.0 || sp.y < 174) {
            sp.life = 0.0;
            sp.x = 25.5 + (Math.random() - 0.5) * 4.5;
            sp.y = 211.0;
          }
          const alpha = Math.sin(sp.life * Math.PI) * 0.28;
          const steamR = Math.min(255, 195 * intMR + 60 * bmR);
          const steamG = Math.min(255, 195 * intMG + 55 * bmG);
          const steamB = Math.min(255, 205 * intMB + 50 * bmB);
          blendPixel(sp.x, sp.y, steamR, steamG, steamB, alpha);
        }

        // 2. Floating Sunlit / Moonlit Dust Motes
        for (let i = 0; i < dustParticles.length; i++) {
          const dp = dustParticles[i];
          dp.x += (dp.vx + Math.sin(tSec * 0.8 + dp.phase) * 0.04) * (dt * 30.0);
          dp.y += dp.vy * (dt * 30.0);
          if (dp.y < 15) dp.y = 300;
          if (dp.y > 305) dp.y = 15;
          if (dp.x < 5) dp.x = 172;
          if (dp.x > 174) dp.x = 6;

          const ix = Math.floor(dp.x);
          const iy = Math.floor(dp.y);
          const idx = iy * PW + ix;
          if (extMask[idx] < 0.5) {
            const p4 = idx * 4;
            const curLuma = frameA[p4] * invFrac + frameB[p4] * frac;
            const ambLuma = tileAmb[p4];
            const beamDiff = curLuma - ambLuma;
            if (beamDiff > 18) {
              const twinkle = 0.5 + 0.5 * Math.sin(tSec * 3.5 + dp.phase);
              const a = Math.min(0.65, (beamDiff / 140.0) * twinkle * 0.55);
              blendPixel(ix, iy, Math.min(255, 245 * bmR), Math.min(255, 230 * bmG), Math.min(255, 195 * bmB), a);
            }
          }
        }

        // 3. Night Stars & Fireflies outside window
        const nightFactor = (h >= 20.0 || h <= 5.0)
          ? (h >= 20.0 ? Math.min(1.0, (h - 20.0) / 1.2) : Math.min(1.0, (5.0 - h) / 1.2))
          : 0.0;

        if (nightFactor > 0.02) {
          for (let i = 0; i < stars.length; i++) {
            const st = stars[i];
            const idx = st.y * PW + st.x;
            if (skyCanopyMask[idx] > 0.5) {
              const tw = 0.35 + 0.65 * Math.pow(0.5 + 0.5 * Math.sin(tSec * 2.4 + st.phase), 2.0);
              blendPixel(st.x, st.y, 235, 245, 255, nightFactor * tw * 0.78);
            }
          }
          for (let i = 0; i < fireflies.length; i++) {
            const ff = fireflies[i];
            ff.x += (ff.vx + Math.sin(tSec * 1.5 + ff.phase) * 0.08) * (dt * 30.0);
            ff.y += (ff.vy + Math.cos(tSec * 1.3 + ff.phase) * 0.06) * (dt * 30.0);
            if (ff.x < 2) ff.x = 81;
            if (ff.x > 82) ff.x = 3;
            if (ff.y < 45) ff.y = 148;
            if (ff.y > 150) ff.y = 46;

            const ix = Math.floor(ff.x);
            const iy = Math.floor(ff.y);
            if (extMask[iy * PW + ix] > 0.5) {
              const pulse = Math.max(0.0, Math.sin(tSec * 2.8 + ff.phase));
              const glowA = nightFactor * Math.pow(pulse, 2.2) * 0.88;
              if (glowA > 0.05) {
                blendPixel(ix, iy, 215, 255, 110, glowA);
                blendPixel(ix + 1, iy, 160, 230, 80, glowA * 0.35);
                blendPixel(ix - 1, iy, 160, 230, 80, glowA * 0.35);
              }
            }
          }
        }

        // 4. Morning Mist at Dawn
        if (h >= 4.5 && h <= 6.75) {
          const mistFactor = Math.sin(((h - 4.5) / 2.25) * Math.PI) * 0.26;
          for (let y = 72; y < 146; y++) {
            const band = Math.sin((y * 0.14) + tSec * 0.6) * 0.5 + 0.5;
            const rowAlpha = mistFactor * band * (1.0 - Math.abs(y - 108) / 42.0);
            if (rowAlpha > 0.01) {
              for (let x = 0; x <= 83; x++) {
                if (extMask[y * PW + x] > 0.5) {
                  blendPixel(x, y, 225, 210, 235, rowAlpha);
                }
              }
            }
          }
        }

        // Upscale 180x320 pixel buffer 4x to 720x1280 with nearest-neighbor crisp pixels (no pixel mesh)
        bufCtx.putImageData(outImgData, 0, 0);
        dispCtx.imageSmoothingEnabled = false;
        dispCtx.drawImage(bufferCanvas, 0, 0, DISP_W, DISP_H);
      }

      let lastTime = performance.now();
      function animate(now) {
        const dt = Math.min(0.1, Math.max(0.0, (now - lastTime) / 1000.0));
        lastTime = now;
        renderScene(dt, now);
        requestAnimationFrame(animate);
      }

            requestAnimationFrame(animate);
    })();
  </script>
