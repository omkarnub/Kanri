<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #07090e;
      pointer-events: none;
      user-select: none;
      touch-action: none;
    }

    .gradient-container {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 35%, #0e1326 0%, #07090e 100%);
    }

    .blur-wrapper {
      position: absolute;
      inset: -30%;
      width: 160%;
      height: 160%;
      filter: blur(80px);
      -webkit-filter: blur(80px);
      transform: translate3d(0, 0, 0);
      will-change: transform;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      mix-blend-mode: screen;
      will-change: transform;
    }

    .orb-fill {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      will-change: opacity;
    }

    /* Cycle 1 is base (opacity 1). Cycle 2 fades in over Cycle 1 smoothly */
    .c1 {
      opacity: 1;
    }

    .c2 {
      opacity: 0;
      animation: crossfadeCycle 18s cubic-bezier(0.45, 0.05, 0.55, 0.95) infinite;
    }

    @keyframes crossfadeCycle {
      0%, 35% {
        opacity: 0;
      }
      50%, 85% {
        opacity: 1;
      }
      100% {
        opacity: 0;
      }
    }

    /* 1. Orb 1 (Top-Left): Lime #7cff67 <-> Coral #ff8a5c */
    .orb-1 {
      top: 8%;
      left: 5%;
      width: 92vw;
      height: 92vw;
      animation: moveVertical 26s ease-in-out infinite alternate;
    }
    .orb-1 .c1 {
      background: radial-gradient(circle at center,
        rgba(124, 255, 103, 0.88) 0%,
        rgba(124, 255, 103, 0.65) 28%,
        rgba(34, 211, 197, 0.40) 58%,
        rgba(34, 211, 197, 0.15) 78%,
        rgba(34, 211, 197, 0.0) 100%
      );
    }
    .orb-1 .c2 {
      background: radial-gradient(circle at center,
        rgba(255, 138, 92, 0.88) 0%,
        rgba(255, 138, 92, 0.65) 28%,
        rgba(255, 92, 138, 0.40) 58%,
        rgba(255, 92, 138, 0.15) 78%,
        rgba(255, 92, 138, 0.0) 100%
      );
    }

    /* 2. Orb 2 (Top-Right): Turquoise #22d3c5 <-> Pink #ff5c8a */
    .orb-2 {
      top: 15%;
      right: 2%;
      width: 95vw;
      height: 95vw;
      transform-origin: calc(50% - 150px);
      animation: moveInCircle 24s reverse infinite;
    }
    .orb-2 .c1 {
      background: radial-gradient(circle at center,
        rgba(34, 211, 197, 0.90) 0%,
        rgba(34, 211, 197, 0.68) 28%,
        rgba(143, 92, 255, 0.45) 58%,
        rgba(143, 92, 255, 0.18) 80%,
        rgba(143, 92, 255, 0.0) 100%
      );
    }
    .orb-2 .c2 {
      background: radial-gradient(circle at center,
        rgba(255, 92, 138, 0.90) 0%,
        rgba(255, 92, 138, 0.68) 28%,
        rgba(138, 92, 255, 0.45) 58%,
        rgba(138, 92, 255, 0.18) 80%,
        rgba(138, 92, 255, 0.0) 100%
      );
    }

    /* 3. Orb 3 (Bottom): Violet #8f5cff <-> #8a5cff */
    .orb-3 {
      top: 42%;
      left: 8%;
      width: 90vw;
      height: 90vw;
      transform-origin: calc(50% + 150px);
      animation: moveInCircle 32s linear infinite;
    }
    .orb-3 .c1 {
      background: radial-gradient(circle at center,
        rgba(143, 92, 255, 0.85) 0%,
        rgba(143, 92, 255, 0.62) 30%,
        rgba(34, 211, 197, 0.38) 60%,
        rgba(34, 211, 197, 0.12) 80%,
        rgba(34, 211, 197, 0.0) 100%
      );
    }
    .orb-3 .c2 {
      background: radial-gradient(circle at center,
        rgba(138, 92, 255, 0.85) 0%,
        rgba(138, 92, 255, 0.62) 30%,
        rgba(255, 92, 138, 0.38) 60%,
        rgba(255, 92, 138, 0.12) 80%,
        rgba(255, 92, 138, 0.0) 100%
      );
    }

    /* 4. Orb 4 (Center-Right Satellite): Lime #7cff67 <-> Coral #ff8a5c */
    .orb-4 {
      top: 25%;
      right: 12%;
      width: 86vw;
      height: 86vw;
      animation: moveHorizontal 30s ease-in-out infinite;
    }
    .orb-4 .c1 {
      background: radial-gradient(circle at center,
        rgba(124, 255, 103, 0.78) 0%,
        rgba(34, 211, 197, 0.52) 35%,
        rgba(143, 92, 255, 0.25) 68%,
        rgba(143, 92, 255, 0.0) 100%
      );
    }
    .orb-4 .c2 {
      background: radial-gradient(circle at center,
        rgba(255, 138, 92, 0.78) 0%,
        rgba(255, 92, 138, 0.52) 35%,
        rgba(138, 92, 255, 0.25) 68%,
        rgba(138, 92, 255, 0.0) 100%
      );
    }

    /* 5. Orb 5 (Bottom-Center Bloom): Turquoise #22d3c5 <-> Pink #ff5c8a */
    .orb-5 {
      bottom: 4%;
      left: 16%;
      width: 88vw;
      height: 88vw;
      transform-origin: calc(50% - 130px);
      animation: moveInCircle 22s ease-in-out infinite alternate;
    }
    .orb-5 .c1 {
      background: radial-gradient(circle at center,
        rgba(34, 211, 197, 0.82) 0%,
        rgba(143, 92, 255, 0.58) 32%,
        rgba(124, 255, 103, 0.30) 65%,
        rgba(124, 255, 103, 0.0) 100%
      );
    }
    .orb-5 .c2 {
      background: radial-gradient(circle at center,
        rgba(255, 92, 138, 0.82) 0%,
        rgba(138, 92, 255, 0.58) 32%,
        rgba(255, 138, 92, 0.30) 65%,
        rgba(255, 138, 92, 0.0) 100%
      );
    }

    /* 6. Orb Ambient (Central Multichromatic Connector) */
    .orb-ambient {
      top: 20%;
      left: 15%;
      width: 92vw;
      height: 92vw;
      animation: moveVertical 28s ease-in-out infinite alternate;
    }
    .orb-ambient .c1 {
      background: radial-gradient(circle at center,
        rgba(143, 92, 255, 0.45) 0%,
        rgba(34, 211, 197, 0.35) 35%,
        rgba(124, 255, 103, 0.20) 65%,
        rgba(124, 255, 103, 0.0) 100%
      );
    }
    .orb-ambient .c2 {
      background: radial-gradient(circle at center,
        rgba(138, 92, 255, 0.45) 0%,
        rgba(255, 92, 138, 0.35) 35%,
        rgba(255, 138, 92, 0.20) 65%,
        rgba(255, 138, 92, 0.0) 100%
      );
    }

    @keyframes moveHorizontal {
      0% {
        transform: translate3d(-35%, -8%, 0);
      }
      50% {
        transform: translate3d(35%, 8%, 0);
      }
      100% {
        transform: translate3d(-35%, -8%, 0);
      }
    }

    @keyframes moveInCircle {
      0% {
        transform: rotate(0deg);
      }
      50% {
        transform: rotate(180deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes moveVertical {
      0% {
        transform: translateY(-32%);
      }
      50% {
        transform: translateY(32%);
      }
      100% {
        transform: translateY(-32%);
      }
    }

    /* Micro-fine analogue grain for smooth organic dithering (prevents 8-bit OLED banding) */
    .noise-overlay {
      position: absolute;
      inset: 0;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }
  </style>
</head>
<body>
  <div class="gradient-container">
    <div class="blur-wrapper">
      <div class="orb orb-1">
        <div class="orb-fill c1"></div>
        <div class="orb-fill c2"></div>
      </div>
      <div class="orb orb-2">
        <div class="orb-fill c1"></div>
        <div class="orb-fill c2"></div>
      </div>
      <div class="orb orb-3">
        <div class="orb-fill c1"></div>
        <div class="orb-fill c2"></div>
      </div>
      <div class="orb orb-4">
        <div class="orb-fill c1"></div>
        <div class="orb-fill c2"></div>
      </div>
      <div class="orb orb-5">
        <div class="orb-fill c1"></div>
        <div class="orb-fill c2"></div>
      </div>
      <div class="orb orb-ambient">
        <div class="orb-fill c1"></div>
        <div class="orb-fill c2"></div>
      </div>
    </div>
    <div class="noise-overlay"></div>
  </div>
</body>
</html>
