<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #090714;
      pointer-events: none;
      user-select: none;
      touch-action: none;
    }

    .gradient-container {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 40%, #150f28 0%, #080611 100%);
    }

    .blur-wrapper {
      position: absolute;
      inset: -30%;
      width: 160%;
      height: 160%;
      filter: blur(80px);
      -webkit-filter: blur(80px);
      transform: translateZ(0);
      will-change: transform;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      mix-blend-mode: screen;
      will-change: transform;
    }

    /* 1. Violet -> Fuchsia -> Rose with color-matched zero-alpha termination (no grey fringing) */
    .orb-1 {
      top: 10%;
      left: 5%;
      width: 90vw;
      height: 90vw;
      background: radial-gradient(circle at center,
        rgba(139, 92, 246, 0.85) 0%,
        rgba(192, 132, 252, 0.70) 25%,
        rgba(236, 72, 153, 0.55) 50%,
        rgba(244, 63, 94, 0.25) 75%,
        rgba(244, 63, 94, 0.0) 100%
      );
      animation: moveVertical 28s ease-in-out infinite;
    }

    /* 2. Cyan -> Azure -> Indigo */
    .orb-2 {
      top: 20%;
      right: 0%;
      width: 95vw;
      height: 95vw;
      background: radial-gradient(circle at center,
        rgba(6, 182, 212, 0.85) 0%,
        rgba(59, 130, 246, 0.70) 30%,
        rgba(99, 102, 241, 0.50) 60%,
        rgba(67, 56, 202, 0.20) 80%,
        rgba(67, 56, 202, 0.0) 100%
      );
      transform-origin: calc(50% - 160px);
      animation: moveInCircle 22s reverse infinite;
    }

    /* 3. Emerald -> Mint -> Turquoise */
    .orb-3 {
      top: 40%;
      left: 10%;
      width: 88vw;
      height: 88vw;
      background: radial-gradient(circle at center,
        rgba(16, 185, 129, 0.80) 0%,
        rgba(52, 211, 153, 0.65) 28%,
        rgba(20, 184, 166, 0.45) 55%,
        rgba(6, 182, 212, 0.20) 78%,
        rgba(6, 182, 212, 0.0) 100%
      );
      transform-origin: calc(50% + 160px);
      animation: moveInCircle 36s linear infinite;
    }

    /* 4. Amber -> Apricot -> Coral */
    .orb-4 {
      top: 2%;
      left: 20%;
      width: 85vw;
      height: 85vw;
      background: radial-gradient(circle at center,
        rgba(245, 158, 11, 0.75) 0%,
        rgba(251, 146, 60, 0.60) 28%,
        rgba(251, 113, 133, 0.40) 58%,
        rgba(244, 63, 94, 0.18) 80%,
        rgba(244, 63, 94, 0.0) 100%
      );
      animation: moveHorizontal 38s ease-in-out infinite;
    }

    /* 5. Deep Ultraviolet -> Electric Orchid -> Sunset Coral */
    .orb-5 {
      bottom: 2%;
      right: 10%;
      width: 90vw;
      height: 90vw;
      background: radial-gradient(circle at center,
        rgba(147, 51, 234, 0.80) 0%,
        rgba(168, 85, 247, 0.60) 32%,
        rgba(244, 63, 94, 0.40) 62%,
        rgba(251, 113, 133, 0.18) 82%,
        rgba(251, 113, 133, 0.0) 100%
      );
      transform-origin: calc(50% - 130px);
      animation: moveInCircle 24s ease-in-out infinite;
    }

    /* 6. Ambient Central Diffusion (Silky multi-chromatic connector) */
    .orb-ambient {
      top: 25%;
      left: 15%;
      width: 85vw;
      height: 85vw;
      background: radial-gradient(circle at center,
        rgba(168, 85, 247, 0.45) 0%,
        rgba(6, 182, 212, 0.35) 35%,
        rgba(245, 158, 11, 0.20) 65%,
        rgba(245, 158, 11, 0.0) 100%
      );
      animation: moveVertical 32s ease-in-out infinite alternate;
    }

    @keyframes moveHorizontal {
      0% {
        transform: translateX(-35%) translateY(-8%);
      }
      50% {
        transform: translateX(35%) translateY(8%);
      }
      100% {
        transform: translateX(-35%) translateY(-8%);
      }
    }

    @keyframes moveInCircle {
      0% {
        transform: rotate(0deg);
      }
      50% {
        transform: rotate(180deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes moveVertical {
      0% {
        transform: translateY(-35%);
      }
      50% {
        transform: translateY(35%);
      }
      100% {
        transform: translateY(-35%);
      }
    }

    /* Micro-fine analogue grain for smooth organic dithering */
    .noise-overlay {
      position: absolute;
      inset: 0;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }
  </style>
</head>
<body>
  <div class="gradient-container">
    <div class="blur-wrapper">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
      <div class="orb orb-4"></div>
      <div class="orb orb-5"></div>
      <div class="orb orb-ambient"></div>
    </div>
    <div class="noise-overlay"></div>
  </div>
</body>
</html>
