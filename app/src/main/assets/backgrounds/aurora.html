<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #07090e;
      pointer-events: none;
      user-select: none;
      touch-action: none;
    }

    .gradient-container {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: radial-gradient(ellipse at 50% 32%, #0d1224 0%, #080a14 55%, #040509 100%);
    }

    .blur-wrapper {
      position: absolute;
      inset: -25%;
      width: 150%;
      height: 150%;
      filter: blur(85px);
      -webkit-filter: blur(85px);
      transform: translate3d(0, 0, 0);
      will-change: transform;
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      mix-blend-mode: screen;
      will-change: transform;
    }

    /* 1. Gemini Electric Blue & Radiant Cyan Spark (Google Blue core) */
    .orb-cyan-blue {
      top: 8%;
      left: -6%;
      width: 96vw;
      height: 96vw;
      background: radial-gradient(ellipse at 45% 45%,
        rgba(0, 229, 255, 0.92) 0%,
        rgba(26, 115, 232, 0.85) 26%,
        rgba(66, 133, 244, 0.60) 52%,
        rgba(37, 99, 235, 0.22) 75%,
        rgba(37, 99, 235, 0.0) 100%
      );
      animation: geminiDrift1 26s ease-in-out infinite alternate;
    }

    /* 2. Gemini Radiant Violet & Vivid Fuchsia / Magenta Aurora Ribbon */
    .orb-violet-pink {
      top: 14%;
      right: -10%;
      width: 102vw;
      height: 102vw;
      background: radial-gradient(ellipse at 55% 50%,
        rgba(255, 46, 147, 0.88) 0%,
        rgba(217, 70, 239, 0.78) 25%,
        rgba(168, 85, 247, 0.58) 50%,
        rgba(124, 58, 237, 0.25) 75%,
        rgba(124, 58, 237, 0.0) 100%
      );
      transform-origin: 45% 55%;
      animation: geminiOrbit 32s linear infinite reverse;
    }

    /* 3. Gemini Neural Core — Incandescent Spark Pulsar (Thinking / Live Core) */
    .orb-neural-core {
      top: 28%;
      left: 18%;
      width: 76vw;
      height: 76vw;
      background: radial-gradient(circle at center,
        rgba(240, 249, 255, 0.95) 0%,
        rgba(186, 230, 253, 0.75) 20%,
        rgba(56, 189, 248, 0.48) 42%,
        rgba(99, 102, 241, 0.20) 70%,
        rgba(99, 102, 241, 0.0) 100%
      );
      animation: geminiPulse 14s ease-in-out infinite alternate;
    }

    /* 4. Google Live Sunset Ribbon — Coral Red & Amber Gold (Warm Horizon Accent) */
    .orb-coral-amber {
      bottom: 5%;
      left: 6%;
      width: 92vw;
      height: 88vw;
      background: radial-gradient(ellipse at 45% 55%,
        rgba(251, 188, 4, 0.82) 0%,
        rgba(249, 115, 22, 0.65) 26%,
        rgba(234, 67, 53, 0.48) 52%,
        rgba(225, 29, 72, 0.18) 76%,
        rgba(225, 29, 72, 0.0) 100%
      );
      animation: geminiDrift2 30s ease-in-out infinite alternate;
    }

    /* 5. Google Emerald Shimmer — Jade / Mint Flow Ribbon (Perimeter Accent) */
    .orb-emerald-teal {
      top: 48%;
      right: 4%;
      width: 82vw;
      height: 82vw;
      background: radial-gradient(circle at center,
        rgba(52, 168, 83, 0.75) 0%,
        rgba(16, 185, 129, 0.52) 30%,
        rgba(6, 182, 212, 0.30) 60%,
        rgba(6, 182, 212, 0.0) 100%
      );
      transform-origin: calc(50% + 140px) calc(50% - 90px);
      animation: geminiOrbit 38s linear infinite;
    }

    /* 6. Gemini Cosmic Indigo Atmospheric Veil (Seamless Diffuse Body) */
    .orb-atmosphere {
      top: 16%;
      left: 10%;
      width: 108vw;
      height: 108vw;
      background: radial-gradient(circle at center,
        rgba(99, 102, 241, 0.42) 0%,
        rgba(139, 92, 246, 0.32) 35%,
        rgba(236, 72, 153, 0.18) 65%,
        rgba(236, 72, 153, 0.0) 100%
      );
      animation: geminiDriftVertical 34s ease-in-out infinite alternate;
    }

    @keyframes geminiDrift1 {
      0% {
        transform: translate3d(-18%, -10%, 0) scale(1.0);
      }
      50% {
        transform: translate3d(18%, 14%, 0) scale(1.10);
      }
      100% {
        transform: translate3d(-18%, -10%, 0) scale(1.0);
      }
    }

    @keyframes geminiOrbit {
      0% {
        transform: rotate(0deg);
      }
      100% {
        transform: rotate(360deg);
      }
    }

    @keyframes geminiPulse {
      0% {
        transform: scale(0.88) translate3d(-6%, -4%, 0);
        opacity: 0.85;
      }
      50% {
        transform: scale(1.16) translate3d(8%, 6%, 0);
        opacity: 1.0;
      }
      100% {
        transform: scale(0.88) translate3d(-6%, -4%, 0);
        opacity: 0.85;
      }
    }

    @keyframes geminiDrift2 {
      0% {
        transform: translate3d(22%, 8%, 0) scale(1.05);
      }
      50% {
        transform: translate3d(-18%, -10%, 0) scale(0.96);
      }
      100% {
        transform: translate3d(22%, 8%, 0) scale(1.05);
      }
    }

    @keyframes geminiDriftVertical {
      0% {
        transform: translateY(-22%) scale(0.98);
      }
      50% {
        transform: translateY(22%) scale(1.05);
      }
      100% {
        transform: translateY(-22%) scale(0.98);
      }
    }

    /* Micro-fine analogue grain for smooth organic dithering (prevents 8-bit OLED banding) */
    .noise-overlay {
      position: absolute;
      inset: 0;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
    }
  </style>
</head>
<body>
  <div class="gradient-container">
    <div class="blur-wrapper">
      <div class="orb orb-cyan-blue"></div>
      <div class="orb orb-violet-pink"></div>
      <div class="orb orb-atmosphere"></div>
      <div class="orb orb-neural-core"></div>
      <div class="orb orb-coral-amber"></div>
      <div class="orb orb-emerald-teal"></div>
    </div>
    <div class="noise-overlay"></div>
  </div>
</body>
</html>
