      ]
    };

    // 24-Hour keyframes across normalized day cycle [0.0 .. 1.0]:
    // 0.00 = Dawn (06:00)
    // 0.20 = Paths Sunlight (10:00)
    // 0.45 = Midday (14:30)
    // 0.70 = Shiganshina Dusk (18:30)
    // 0.88 = Paths Starlight Night (22:30 - 03:30)
    const DAY_STAGES = [
      { pos: 0.00, pal: PALETTES.dawn,           nightFactor: 0.15 },
      { pos: 0.20, pal: PALETTES.paths_sunlight, nightFactor: 0.00 },
      { pos: 0.45, pal: PALETTES.midday,         nightFactor: 0.00 },
      { pos: 0.70, pal: PALETTES.dusk,           nightFactor: 0.20 },
      { pos: 0.86, pal: PALETTES.night,          nightFactor: 1.00 },
      { pos: 1.00, pal: PALETTES.dawn,           nightFactor: 0.15 }
    ];

    const activePalette = Array.from({ length: 16 }, (_, i) => [...PALETTES.paths_sunlight[i]]);

    const BAYER_4X4 = [
      [ 0,  8,  2, 10],
      [12,  4, 14,  6],
      [ 3, 11,  1,  9],
      [15,  7, 13,  5]
    ].map(row => row.map(v => (v / 16.0) - 0.46875));

    // =========================================================================
    // LOCKED CONFIGURATION: 576x1024, 9:16, CALM WIND, 24-HOUR LOOP
    // =========================================================================
    const GW = 576;
    const GH = 1024;
    const WIND_SPEED = 0.65; // Calm wind
    const DAY_CYCLE_DURATION = 60.0; // Full 24-hour cycle every 60 seconds

    let simTime = 0;
    let cycleClock = 7.0; // Starts in radiant morning Paths Sunlight transitioning into midday, dusk, night, and dawn
    let currentNightFactor = 0.0;
    let windmillAngle1 = 0.4;
    let windmillAngle2 = 1.1;

    // 32x32x32 3D RGB Lookup Table -> maps (r>>3, g>>3, b>>3) to closest color index 0..15
    const rgb555ToPaletteIdx = new Uint8Array(32 * 32 * 32);

    function buildColorLUT() {
      const refPal = PALETTES.midday;
      for (let r5 = 0; r5 < 32; r5++) {
        const r = (r5 << 3) | (r5 >> 2);
        for (let g5 = 0; g5 < 32; g5++) {
          const g = (g5 << 3) | (g5 >> 2);
          for (let b5 = 0; b5 < 32; b5++) {
            const b = (b5 << 3) | (b5 >> 2);
            let bestIdx = 0;
            let bestDist = 1e9;
            for (let i = 0; i < 16; i++) {
              const pr = refPal[i][0];
              const pg = refPal[i][1];
              const pb = refPal[i][2];
              const dr = r - pr;
              const dg = g - pg;
              const db = b - pb;
              const dist = (dr * dr * 3) + (dg * dg * 4) + (db * db * 2);
              if (dist < bestDist) {
                bestDist = dist;
                bestIdx = i;
              }
            }
            rgb555ToPaletteIdx[(r5 << 10) | (g5 << 5) | b5] = bestIdx;
          }
        }
      }
    }

    // =========================================================================
    // REALISTIC AERODYNAMIC CALM WIND & CANTILEVER STALK ENGINE
    // =========================================================================
    const STALK_TABLE_SIZE = 576;
    const stalkStiffness = new Float32Array(STALK_TABLE_SIZE);
    const stalkPhaseOffset = new Float32Array(STALK_TABLE_SIZE);
    const canopyCluster = new Float32Array(STALK_TABLE_SIZE);

    function smoothHash(n) {
      const x = Math.sin(n * 127.1 + 311.7) * 43758.5453;
      return x - Math.floor(x);
    }

    function valueNoise1D(x) {
      const i = Math.floor(x);
      const f = x - i;
      const u = f * f * (3.0 - 2.0 * f);
      return smoothHash(i) * (1.0 - u) + smoothHash(i + 1) * u;
    }

    function initWindTables() {
      for (let i = 0; i < STALK_TABLE_SIZE; i++) {
        const u = i / STALK_TABLE_SIZE;
        stalkStiffness[i] = 0.72 + 0.56 * valueNoise1D(u * 26.0);
        stalkPhaseOffset[i] = (valueNoise1D(u * 32.0 + 19.3) - 0.5) * 1.4;
        canopyCluster[i] = (valueNoise1D(u * 22.0 + 7.1) - 0.5) * 2.0;
      }
    }

    function evaluateWindGust(u, t, phaseOffset) {
      const p1 = t * 1.15 - u * 2.1 + phaseOffset * 0.35;
      const p2 = t * 0.68 - u * 1.35 + 2.1 - phaseOffset * 0.25;
      const p3 = t * 1.85 - u * 3.2 + phaseOffset * 0.5;

      const g1 = Math.pow(Math.max(0, 0.5 + 0.5 * Math.sin(p1)), 2.6);
      const g2 = Math.pow(Math.max(0, 0.5 + 0.5 * Math.sin(p2)), 3.2);
      const g3 = Math.pow(Math.max(0, 0.5 + 0.5 * Math.sin(p3)), 2.2) * 0.35;

      const gustEnvelope = 0.14 + 0.58 * g1 + 0.42 * g2 + g3;

      const flutterAmp = Math.min(1.0, (gustEnvelope - 0.14) * 1.25);
      const tipFlutter = (
        Math.sin(t * 6.8 - u * 19.0 + phaseOffset * 4.0) * 0.11 +
        Math.cos(t * 9.4 + u * 27.0 - phaseOffset * 3.0) * 0.06
      ) * flutterAmp;

      return Math.max(0.02, gustEnvelope + tipFlutter);
    }

    let srcPixels = null;

    // Animated particle pools
    const fallingLeaves = [];
    const pollenMotes = [];
    const windStreaks = [];
    const skyBirds = [];
    const nightStars = [];

    function initParticles() {
      fallingLeaves.length = 0;
      for (let i = 0; i < 18; i++) {
        fallingLeaves.push({
          u: 0.04 + Math.random() * 0.88,
          v: 0.28 + Math.random() * 0.52,
          baseVx: 0.020 + Math.random() * 0.018,
          baseVy: 0.007 + Math.random() * 0.010,
          tumblePhase: Math.random() * Math.PI * 2,
          tumbleSpeed: 4.0 + Math.random() * 3.0,
          kind: i % 3 === 0 ? 'petal' : (Math.random() > 0.45 ? 'brightLeaf' : 'darkLeaf')
        });
      }

      pollenMotes.length = 0;
      for (let i = 0; i < 28; i++) {
        pollenMotes.push({
          u: Math.random(),
          v: 0.46 + Math.random() * 0.52,
          speedY: -0.004 - Math.random() * 0.005,
          speedX: 0.010 + Math.random() * 0.012,
          phase: Math.random() * Math.PI * 2,
          type: Math.random() > 0.38 ? 'gold' : 'petal'
        });
      }

      windStreaks.length = 0;
      for (let i = 0; i < 4; i++) {
        windStreaks.push({
          u: Math.random() * 0.7,
          v: 0.46 + i * 0.12 + Math.random() * 0.05,
          length: 0.10 + Math.random() * 0.06,
          speed: 0.22 + Math.random() * 0.07,
          curveAmp: 0.007 + Math.random() * 0.006,
          life: Math.random(),
          lifeSpeed: 0.42 + Math.random() * 0.20
        });
      }

      skyBirds.length = 0;
      for (let i = 0; i < 4; i++) {
        skyBirds.push({
          u: 0.15 + i * 0.035 + Math.random() * 0.02,
          v: 0.18 + i * 0.012,
          speed: 0.009 + Math.random() * 0.002,
          flapPhase: i * 1.4
        });
      }

      // Twinkling stars in upper sky during the Night phase of the 24-hour cycle
      nightStars.length = 0;
      for (let i = 0; i < 42; i++) {
        nightStars.push({
          u: 0.03 + smoothHash(i * 7.3) * 0.94,
          v: 0.02 + smoothHash(i * 13.7 + 4.1) * 0.36,
          twinkleSpeed: 1.5 + smoothHash(i * 3.1) * 2.5,
          phase: smoothHash(i * 19.9) * Math.PI * 2
        });
      }
    }

    function update24HourPalette(dt) {
      const nowTime = new Date(); const realHour = nowTime.getHours() + nowTime.getMinutes() / 60 + nowTime.getSeconds() / 3600; const dayPos = ((realHour - 6.0 + 24.0) % 24.0) / 24.0; // 0.0 .. 1.0

      let stageA = DAY_STAGES[0];
      let stageB = DAY_STAGES[1];
      for (let i = 0; i < DAY_STAGES.length - 1; i++) {
        if (dayPos >= DAY_STAGES[i].pos && dayPos <= DAY_STAGES[i + 1].pos) {
          stageA = DAY_STAGES[i];
          stageB = DAY_STAGES[i + 1];
          break;
        }
      }

      const span = Math.max(0.0001, stageB.pos - stageA.pos);
      const rawT = (dayPos - stageA.pos) / span;
      // Smooth cosine interpolation between time-of-day stages
      const tSmooth = 0.5 - 0.5 * Math.cos(rawT * Math.PI);

      currentNightFactor = stageA.nightFactor + (stageB.nightFactor - stageA.nightFactor) * tSmooth;

      for (let i = 0; i < 16; i++) {
        activePalette[i][0] = Math.round(stageA.pal[i][0] + (stageB.pal[i][0] - stageA.pal[i][0]) * tSmooth);
        activePalette[i][1] = Math.round(stageA.pal[i][1] + (stageB.pal[i][1] - stageA.pal[i][1]) * tSmooth);
        activePalette[i][2] = Math.round(stageA.pal[i][2] + (stageB.pal[i][2] - stageA.pal[i][2]) * tSmooth);
      }
    }

    function drawPixelLine(buf, gw, gh, x0, y0, x1, y1, r, g, b) {
      let ix0 = Math.round(x0);
      let iy0 = Math.round(y0);
      const ix1 = Math.round(x1);
      const iy1 = Math.round(y1);
      const dx = Math.abs(ix1 - ix0);
      const dy = -Math.abs(iy1 - iy0);
      const sx = ix0 < ix1 ? 1 : -1;
      const sy = iy0 < iy1 ? 1 : -1;
      let err = dx + dy;

      while (true) {
        if (ix0 >= 0 && ix0 < gw && iy0 >= 0 && iy0 < gh) {
          const p = (iy0 * gw + ix0) * 3;
          buf[p] = r;
          buf[p + 1] = g;
          buf[p + 2] = b;
        }
        if (ix0 === ix1 && iy0 === iy1) break;
        const e2 = 2 * err;
        if (e2 >= dy) { err += dy; ix0 += sx; }
        if (e2 <= dx) { err += dx; iy0 += sy; }
      }
    }

    // =========================================================================
    // MAIN REAL-TIME 4-BIT PIXEL ART ANIMATION & QUANTIZATION PASS
    // =========================================================================
    const pixelCanvas = document.getElementById('pixelCanvas');
    const ctx = pixelCanvas.getContext('2d', { alpha: false });
    const ambientCanvas = document.getElementById('ambientCanvas');
    const ambientCtx = ambientCanvas.getContext('2d', { alpha: false });
    ambientCanvas.width = 192;
    ambientCanvas.height = 341;

    const cleanSourceImg = document.getElementById('cleanSourceImg');
    const frameImageData = ctx.createImageData(GW, GH);
    const rgbWorkBuf = new Uint8ClampedArray(GW * GH * 3);
    const rowWindGust = new Float32Array(GW);

    function renderFrame(dt) {
      if (!srcPixels) return;

      update24HourPalette(dt);

      simTime += dt * WIND_SPEED;
      const t = simTime;

      // Precompute horizontal calm wind gust profile across all columns
      for (let px = 0; px < GW; px++) {
        const u = px / GW;
        const phaseOff = stalkPhaseOffset[px];
        const stiff = stalkStiffness[px];
        rowWindGust[px] = evaluateWindGust(u, t, phaseOff) * stiff;
      }

      // 1. Sample 1:1 Source Image with Realistic Cantilever Foliage & Calm Gust Physics
      for (let py = 0; py < GH; py++) {
        const v = py / GH;

        for (let px = 0; px < GW; px++) {
          const u = px / GW;
          let sampleU = u;
          let sampleV = v;
          let lightDelta = 0;

          const origIdx = (py * GW + px) << 2;
          const or = srcPixels[origIdx];
          const og = srcPixels[origIdx + 1];
          const ob = srcPixels[origIdx + 2];

          const localGust = rowWindGust[px];

          // LAYER A: Upper Sky & Steady Downwind Cloud Drift (v < 0.425, outside tree canopy)
          const inTreeBox = (u < 0.55 && v > 0.23 && v < 0.505 && (ob < og + 45 || og < 140));
          if (v < 0.425 && !inTreeBox) {
            const whiteness = (or + og + ob) * 0.3333;
            if (whiteness > 165) {
              const cloudWeight = Math.min(1.0, (whiteness - 165) / 65.0);
              const drift = ((t * 0.0035) % 0.028) - 0.014;
              const edgeShear = Math.sin(t * 0.35 + u * 5.0) * 0.0025;
              sampleU = u - (drift * 0.35 + edgeShear) * cloudWeight;
            }
            if (u > 0.50 && v < 0.41 && currentNightFactor < 0.6) {
              const rayWave = Math.sin((u * 15.0 - v * 12.0) - t * 1.0);
              if (rayWave > 0.25) {
                lightDelta += (rayWave - 0.25) * 13.0 * (1.0 - currentNightFactor);
              }
            }
          }

          // LAYER B: Giant Tree Canopy — Downwind Bough Lean & Leaf Rustle
          else if (inTreeBox) {
            const isTrunk = (v > 0.435 && u > 0.11 && u < 0.245 && or > og - 10 && ob < 90);
            if (!isTrunk) {
              const dxTrunk = u - 0.20;
              const dyTrunk = v - 0.45;
              const branchFlex = Math.min(1.0, Math.sqrt(dxTrunk * dxTrunk + dyTrunk * dyTrunk) * 3.2);
              const boughVar = canopyCluster[px];
              const leafRustle = Math.sin(t * 7.2 + u * 45.0 + v * 38.0 + boughVar * 3.0) * 0.0008 * localGust;
              const leanX = (localGust * 0.0052 * branchFlex) + leafRustle;
              sampleU = u - leanX;
              sampleV = v - (leanX * 0.22 * (dxTrunk > 0 ? 1.0 : -0.3));

              if (og > 118 && localGust > 0.35) {
                const sparkle = Math.sin(t * 6.5 + u * 55.0 + v * 42.0);
                if (sparkle > 0.2) {
                  lightDelta += sparkle * (localGust - 0.25) * 16.0;
                }
              }
            }
          }

          // LAYER C: Character Sitting Under the Tree — Hair & Scarf Streaming in the Breeze
          else if (u > 0.295 && u < 0.340 && v > 0.528 && v < 0.562) {
            if (or < 115 && ob < 130) {
              const hairTipFactor = Math.max(0, (v - 0.530) / 0.030);
              const hairStream = localGust * 0.0030 * hairTipFactor;
              sampleU = u - hairStream;
            }
          }

          // LAYER D: Sunlit Grassy Hill & Distant Meadow — Travelling Gust Sheen & Blade Lean
          else if (v >= 0.495 && v < 0.575 && (og > ob - 15)) {
            const bladeLean = localGust * 0.0026;
            sampleU = u - bladeLean;
            if (localGust > 0.32) {
              lightDelta += (localGust - 0.32) * 22.0;
            }
          }

          // LAYER E: Foreground Blue Gentian Flowers & Leaves — True Cantilever Stem Physics
          if (v >= 0.565) {
            const luma = (or * 3 + og * 4 + ob * 2) / 9;

            let tissueFlex = 0.45;
            if (luma < 36) {
              tissueFlex = 0.06;
            } else if (ob > og + 16) {
              tissueFlex = 0.85 + Math.min(0.35, (ob - og) / 140.0);
            } else if (og > or + 8) {
              tissueFlex = 0.56;
            }

            const depthScale = 0.42 + 0.58 * Math.pow((v - 0.565) / 0.435, 0.85);
            const bendX = localGust * tissueFlex * depthScale * 0.0110;
            const bendY = bendX * 0.24;

            sampleU = u - bendX;
            sampleV = v - bendY;

            if (ob > og + 28 && localGust > 0.38) {
              lightDelta += (localGust - 0.38) * 14.0;
            }
          }

          // Bilinear sub-pixel sampling from srcPixels
          const fx = Math.max(0, Math.min(GW - 1.001, sampleU * (GW - 1)));
          const fy = Math.max(0, Math.min(GH - 1.001, sampleV * (GH - 1)));
          const x0 = fx | 0;
          const y0 = fy | 0;
          const wx = fx - x0;
          const wy = fy - y0;
          const w00 = (1 - wx) * (1 - wy);
          const w10 = wx * (1 - wy);
          const w01 = (1 - wx) * wy;
          const w11 = wx * wy;

          const row0 = y0 * GW;
          const row1 = (y0 + 1) * GW;
          const i00 = (row0 + x0) << 2;
          const i10 = (row0 + x0 + 1) << 2;
          const i01 = (row1 + x0) << 2;
          const i11 = (row1 + x0 + 1) << 2;

          const sr = srcPixels[i00] * w00 + srcPixels[i10] * w10 + srcPixels[i01] * w01 + srcPixels[i11] * w11;
          const sg = srcPixels[i00 + 1] * w00 + srcPixels[i10 + 1] * w10 + srcPixels[i01 + 1] * w01 + srcPixels[i11 + 1] * w11;
          const sb = srcPixels[i00 + 2] * w00 + srcPixels[i10 + 2] * w10 + srcPixels[i01 + 2] * w01 + srcPixels[i11 + 2] * w11;

          const outIdx = (py * GW + px) * 3;
          rgbWorkBuf[outIdx]     = sr + lightDelta;
          rgbWorkBuf[outIdx + 1] = sg + lightDelta;
          rgbWorkBuf[outIdx + 2] = sb + lightDelta;
        }
      }

      // 2. Twinkling 4-Bit Stars in Clear Sky Regions During Night/Twilight
      if (currentNightFactor > 0.25) {
        const starStrength = (currentNightFactor - 0.25) / 0.75;
        for (const star of nightStars) {
          const sx = Math.round(star.u * GW);
          const sy = Math.round(star.v * GH);
          if (sx >= 1 && sx < GW - 1 && sy >= 1 && sy < GH - 1) {
            // Only draw star in darker upper-sky regions (not over tree canopy or bright cloud cores)
            const sIdx = (sy * GW + sx) << 2;
            const origR = srcPixels[sIdx];
            const origG = srcPixels[sIdx + 1];
            const origB = srcPixels[sIdx + 2];
            if (origB > 170 && origR < 160 && !(star.u < 0.55 && star.v > 0.23)) {
              const twinkle = 0.5 + 0.5 * Math.sin(t * star.twinkleSpeed + star.phase);
              if (twinkle * starStrength > 0.35) {
                const p = (sy * GW + sx) * 3;
                rgbWorkBuf[p]     = 242;
                rgbWorkBuf[p + 1] = 251;
                rgbWorkBuf[p + 2] = 238;
              }
            }
          }
        }
      }

      // 3. Draw Animated Rotating Twin Windmills
      const gustAtWm1 = evaluateWindGust(428 / 576, t, 0);
      const gustAtWm2 = evaluateWindGust(517 / 576, t, 0.5);
      windmillAngle1 += dt * WIND_SPEED * (0.65 + gustAtWm1 * 1.15);
      windmillAngle2 += dt * WIND_SPEED * (0.58 + gustAtWm2 * 1.05);

      const windmills = [
        { u: 428 / 576, v: 560 / 1024, radius: 14.5 / 576, angle: windmillAngle1 },
        { u: 517 / 576, v: 547 / 1024, radius: 15.5 / 576, angle: windmillAngle2 }
      ];

      for (const wm of windmills) {
        const cx = wm.u * GW;
        const cy = wm.v * GH;
        const rPx = Math.max(3.5, wm.radius * GW);

        for (let b = 0; b < 4; b++) {
          const ang = wm.angle + (b * Math.PI) / 2;
          const ex = cx + Math.cos(ang) * rPx;
          const ey = cy + Math.sin(ang) * rPx;
          drawPixelLine(rgbWorkBuf, GW, GH, cx, cy, ex, ey, 240, 250, 242);
        }
        const hcx = Math.round(cx);
        const hcy = Math.round(cy);
        if (hcx >= 0 && hcx < GW && hcy >= 0 && hcy < GH) {
          const p = (hcy * GW + hcx) * 3;
          rgbWorkBuf[p] = 250;
          rgbWorkBuf[p + 1] = 254;
          rgbWorkBuf[p + 2] = 248;
        }
      }

      // 4. Draw Subtle Aerodynamic Wind Streamlines During Gusts
      for (const streak of windStreaks) {
        streak.u += dt * WIND_SPEED * streak.speed;
        streak.life += dt * WIND_SPEED * streak.lifeSpeed;
        if (streak.u > 1.05 || streak.life > 1.0) {
          streak.u = -0.08 + Math.random() * 0.35;
          streak.v = 0.36 + Math.random() * 0.54;
          streak.life = 0.0;
        }
        const localGust = evaluateWindGust(Math.max(0, Math.min(1, streak.u)), t, 0);
        if (localGust > 0.38) {
          const alpha = Math.sin(streak.life * Math.PI) * Math.min(1.0, (localGust - 0.35) * 1.6);
          const steps = Math.max(12, Math.round(streak.length * GW));
          for (let s = 0; s < steps; s++) {
            if ((s & 2) === 0) continue;
            const frac = s / steps;
            const su = streak.u - (1.0 - frac) * streak.length;
            const sv = streak.v + Math.sin(frac * Math.PI * 1.5 + t * 3.0) * streak.curveAmp - frac * 0.012;
            const px = Math.round(su * GW);
            const py = Math.round(sv * GH);
            if (px >= 0 && px < GW && py >= 0 && py < GH) {
              const taper = Math.sin(frac * Math.PI) * alpha;
              if (taper > 0.22) {
                const p = (py * GW + px) * 3;
                const boost = taper * 40.0;
                rgbWorkBuf[p]     = Math.min(255, rgbWorkBuf[p] + boost);
                rgbWorkBuf[p + 1] = Math.min(255, rgbWorkBuf[p + 1] + boost * 1.1);
                rgbWorkBuf[p + 2] = Math.min(255, rgbWorkBuf[p + 2] + boost * 1.15);
              }
            }
          }
        }
      }

      // 5. Draw Distant Pixel Birds in Upper Sky (Daytime & Dusk)
      if (currentNightFactor < 0.75) {
        for (const bird of skyBirds) {
          bird.u += dt * WIND_SPEED * bird.speed;
          if (bird.u > 0.96) {
            bird.u = 0.05;
            bird.v = 0.14 + Math.random() * 0.09;
          }
          const bx = Math.round(bird.u * GW);
          const by = Math.round((bird.v + Math.sin(t * 1.4 + bird.flapPhase) * 0.003) * GH);
          const wingY = Math.sin(t * 6.5 + bird.flapPhase) > 0 ? -1 : 1;
          if (bx >= 1 && bx < GW - 1 && by >= 1 && by < GH - 1) {
            const cIdx = (by * GW + bx) * 3;
            const lIdx = ((by + wingY) * GW + (bx - 1)) * 3;
            const rIdx = ((by + wingY) * GW + (bx + 1)) * 3;
            rgbWorkBuf[cIdx] = 22; rgbWorkBuf[cIdx + 1] = 50; rgbWorkBuf[cIdx + 2] = 104;
            rgbWorkBuf[lIdx] = 29; rgbWorkBuf[lIdx + 1] = 79; rgbWorkBuf[lIdx + 2] = 163;
            rgbWorkBuf[rIdx] = 29; rgbWorkBuf[rIdx + 1] = 79; rgbWorkBuf[rIdx + 2] = 163;
          }
        }
      }

      // 6. Draw 2D-Tumbling Tree Leaves & Wind-Swept Blue Flower Petals
      for (const leaf of fallingLeaves) {
        const gustHere = evaluateWindGust(Math.max(0, Math.min(1, leaf.u)), t, leaf.tumblePhase);
        const vx = leaf.baseVx * (0.55 + gustHere * 1.85);
        const vy = leaf.baseVy * (1.1 - gustHere * 0.55) + Math.sin(t * 2.6 + leaf.tumblePhase) * 0.006;
        leaf.u += dt * WIND_SPEED * vx;
        leaf.v += dt * WIND_SPEED * vy;
        leaf.tumblePhase += dt * WIND_SPEED * leaf.tumbleSpeed * (0.6 + gustHere);

        if (leaf.u > 0.99 || leaf.v > 0.95) {
          if (leaf.kind === 'petal') {
            leaf.u = Math.random() * 0.75;
            leaf.v = 0.58 + Math.random() * 0.34;
          } else {
            leaf.u = 0.05 + Math.random() * 0.36;
            leaf.v = 0.27 + Math.random() * 0.20;
          }
        }

        const lx = Math.round(leaf.u * GW);
        const ly = Math.round(leaf.v * GH);
        const cosA = Math.cos(leaf.tumblePhase);
        const sinA = Math.sin(leaf.tumblePhase);
        let rCol = 109, gCol = 150, bCol = 39;
        if (leaf.kind === 'brightLeaf') {
          rCol = 205; gCol = 212; bCol = 81;
        } else if (leaf.kind === 'petal') {
          rCol = 85; gCol = 148; bCol = 222;
        }

        for (let s = -2; s <= 2; s++) {
          const px = Math.round(lx + cosA * s);
          const py = Math.round(ly + sinA * s * 0.7);
          if (px >= 0 && px < GW && py >= 0 && py < GH) {
            const p = (py * GW + px) * 3;
            rgbWorkBuf[p] = rCol;
            rgbWorkBuf[p + 1] = gCol;
            rgbWorkBuf[p + 2] = bCol;
          }
        }
      }

      // 7. Floating Pollen Motes (Day) / Glowing Meadow Fireflies (Night)
      for (const mote of pollenMotes) {
        const gustHere = evaluateWindGust(Math.max(0, Math.min(1, mote.u)), t, mote.phase);
        mote.u += dt * WIND_SPEED * (mote.speedX * (0.6 + gustHere * 1.4));
        mote.v += dt * WIND_SPEED * (mote.speedY + Math.sin(t * 1.8 + mote.phase) * 0.003);
        if (mote.u > 0.99 || mote.v < 0.40) {
          mote.u = Math.random() * 0.9;
          mote.v = 0.60 + Math.random() * 0.38;
        }
        const mx = Math.round(mote.u * GW);
        const my = Math.round(mote.v * GH);
        for (let dy = 0; dy < 2; dy++) {
          for (let dx = 0; dx < 2; dx++) {
            const px = mx + dx;
            const py = my + dy;
            if (px >= 0 && px < GW && py >= 0 && py < GH) {
              const p = (py * GW + px) * 3;
              if (mote.type === 'gold') {
                rgbWorkBuf[p] = 242; rgbWorkBuf[p + 1] = 251; rgbWorkBuf[p + 2] = 238;
              } else {
                rgbWorkBuf[p] = 85; rgbWorkBuf[p + 1] = 148; rgbWorkBuf[p + 2] = 222;
              }
            }
          }
        }
      }

      // 8. Quantize Every Pixel Strictly to the Active 16-Color (4-Bit) Palette with 4x4 Bayer Dithering
      const outData = frameImageData.data;
      const ditherStrength = 15.0;

      for (let py = 0; py < GH; py++) {
        const bayerRow4 = BAYER_4X4[py & 3];

        for (let px = 0; px < GW; px++) {
          const inIdx = (py * GW + px) * 3;
          const dVal = bayerRow4[px & 3] * ditherStrength;

          const r = Math.max(0, Math.min(255, rgbWorkBuf[inIdx] + dVal));
          const g = Math.max(0, Math.min(255, rgbWorkBuf[inIdx + 1] + dVal));
          const b = Math.max(0, Math.min(255, rgbWorkBuf[inIdx + 2] + dVal));

          const lutKey = ((r >> 3) << 10) | ((g >> 3) << 5) | (b >> 3);
          const palIdx = rgb555ToPaletteIdx[lutKey];
          const col = activePalette[palIdx];

          const outIdx = (py * GW + px) << 2;
          outData[outIdx]     = col[0];
          outData[outIdx + 1] = col[1];
          outData[outIdx + 2] = col[2];
          outData[outIdx + 3] = 255;
        }
      }

      ctx.putImageData(frameImageData, 0, 0);
      ambientCtx.drawImage(pixelCanvas, 0, 0, ambientCanvas.width, ambientCanvas.height);
    }

    function initEngine() {
      buildColorLUT();
      initWindTables();
      initParticles();

      const extractSource = () => {
        const off = document.createElement('canvas');
        off.width = GW;
        off.height = GH;
        const offCtx = off.getContext('2d');
        offCtx.drawImage(cleanSourceImg, 0, 0, GW, GH);
        srcPixels = offCtx.getImageData(0, 0, GW, GH).data;
        renderFrame(0.016);
      };

      if (cleanSourceImg.complete && cleanSourceImg.naturalWidth > 0) {
        extractSource();
      } else {
        cleanSourceImg.addEventListener('load', extractSource);
      }

      let lastTs = performance.now();
      function loop(now) {
        const dt = Math.min(0.05, (now - lastTs) / 1000);
        lastTs = now;
        renderFrame(dt);
        requestAnimationFrame(loop);
      }
      requestAnimationFrame(loop);
    }

    window.addEventListener('load', initEngine);
  </script>
</body>
