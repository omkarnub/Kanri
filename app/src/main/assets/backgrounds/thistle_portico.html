      windDir = v.windDirection === "left" ? -1 : 1;
      if (tilt || tiltKey) {
        const tk = tilt ? `${tilt}|${W}|${H}|${Cx}|${Cy}` : "";
        if (tk !== tiltKey) {
          tiltKey = tk;
          canvas.style.transform = tilt ? `perspective(${2 * Math.max(W, H)}px) rotateX(${tilt}deg)` : "";
          canvas.style.transformOrigin = `${Cx}px ${Cy}px`;
        }
      }
      const s = sFit;
      if (ptr.moved && rect2 && W) {
        const k = rect2.width / W;
        let lx = (ptr.cx - rect2.left) / k, ly = (ptr.cy - rect2.top) / k;
        if (tilt) {
          const p = 2 * Math.max(W, H), c = Math.cos(tilt * DEG), sn = Math.sin(tilt * DEG);
          const Ys = ly - Cy;
          const Y = Ys * p / (c * p + Ys * sn);
          const f = p / (p - Y * sn);
          lx = Cx + (lx - Cx) / f;
          ly = Cy + Y;
        }
        const dx = (lx - Cx) / s, dy = (ly - Cy) / s;
        const wx = ca * dx + sa * dy + REF_W / 2, wy = -sa * dx + ca * dy + REF_H / 2;
        if (ptr.fresh) {
          ptr.pwx = wx;
          ptr.pwy = wy;
          ptr.fresh = false;
        }
        ptr.wx = wx;
        ptr.wy = wy;
        ptr.moved = false;
      }
      if (dt > 0) {
        const ivx = (ptr.wx - ptr.pwx) / dt, ivy = (ptr.wy - ptr.pwy) / dt;
        const kk = 1 - Math.exp(-dt / 0.05);
        ptr.vx += (clamp(ivx, -4e3, 4e3) - ptr.vx) * kk;
        ptr.vy += (clamp(ivy, -4e3, 4e3) - ptr.vy) * kk;
        ptr.pwx = ptr.wx;
        ptr.pwy = ptr.wy;
      }
      const reachW = 40 + clamp(pp.reach, 0, 10) * 14;
      const gain = clamp(pp.strength, 0, 10) / 5 * 1.1;
      if (ptr.tap && L && !reduce && pp.burst) {
        for (let i = 0; i < NR; i++) {
          const [ax, ay, len] = RACEMES[i];
          const d = Math.hypot(ax - ptr.wx, ay + len / 2 - ptr.wy);
          if (d < 360) rOm[i] += (ptr.wx < ax ? -1 : 1) * (1 - d / 360) * 2.2 * gain;
        }
      }
      physAcc = Math.min(physAcc + dt, 0.1);
      const H_STEP = 1 / 120;
      let awake = false;
      while (physAcc >= H_STEP) {
        physAcc -= H_STEP;
        for (let i = 0; i < NR; i++) {
          rOm[i] += (-36 * rTh[i] - 2.6 * rOm[i]) * H_STEP;
          rTh[i] += rOm[i] * H_STEP;
        }
      }
      if (ptr.over && !reduce && Math.abs(ptr.vx) > 5) {
        for (let i = 0; i < NR; i++) {
          const [ax, ay, len] = RACEMES[i];
          const px = ptr.wx - ax, py = ptr.wy - ay;
          const along = clamp(py / len, 0, 1);
          const d = Math.hypot(px, py - along * len);
          if (d > reachW) continue;
          const w = (1 - d / reachW) ** 2;
          rOm[i] = clamp(rOm[i] - gain * ptr.vx * w * (0.3 + along) * dt * 6 / len, -7, 7);
        }
      }
      for (let i = 0; i < NR; i++) if (Math.abs(rTh[i]) > 4e-4 || Math.abs(rOm[i]) > 4e-3) awake = true;
      if (!awake) {
        rTh.fill(0);
        rOm.fill(0);
      }
      physAwake = awake;
      const nP = Math.round(clamp(v.petals, 0, 10) * 6);
      if (L && !petalsSeeded) {
        for (let i = 0; i < pX.length; i++) {
          spawnPetal(i, box, false);
          if (i >= nP) pLife[i] = 0;
        }
        petalsSeeded = true;
      }
      if (L && ptr.tap && pp.burst && !reduce) {
        for (let n = 0; n < BURST; n++) {
          const i = PETAL_MAX + burstNext++ % BURST_POOL;
          spawnPetal(i, box, false);
          const a = pr() * TAU, sp = 120 + pr() * 260;
          pX[i] = ptr.wx;
          pY[i] = ptr.wy;
          pVX[i] = Math.cos(a) * sp;
          pVY[i] = Math.sin(a) * sp - 80;
        }
      }
      ptr.tap = false;
      const pdt0 = dt * rate, bdt = reduce ? 0 : dt * Math.max(rate, 1);
      burstAlive = false;
      if (pdt0 > 0 || bdt > 0) {
        for (let i = 0; i < pX.length; i++) {
          const burst = i >= PETAL_MAX;
          const pdt = burst ? bdt : pdt0;
          if (pdt <= 0) continue;
          const fade = 1 - Math.exp(-pdt * 1.4);
          if (burst && pLife[i] > 0) burstAlive = true;
          if (!burst && i >= nP) {
            pLife[i] = 0;
            continue;
          }
          if (pLife[i] <= 0) {
            if (!burst) spawnPetal(i, box, true);
            continue;
          }
          if (pLand[i] > 0) {
            pLand[i] += pdt;
            if (pLand[i] > 2.2) {
              pLife[i] = 0;
              if (!burst) spawnPetal(i, box, true);
            }
            continue;
          }
          if (burst) {
            pLife[i] -= pdt / 6;
            if (pLife[i] <= 0) continue;
          }
          const z = pZ[i];
          const wind = windDir * breezeK * (16 + 12 * Math.sin(t * 0.45 + pY[i] * 4e-3));
          const fall = (34 + 18 * z) * (0.6 + 0.4 * Math.sin(pFl[i] * 0.5) ** 2);
          pVX[i] += (wind - pVX[i]) * fade;
          pVY[i] += (fall - pVY[i]) * fade;
          pX[i] += (pVX[i] + Math.sin(pFl[i]) * 14 * z) * pdt;
          pY[i] += pVY[i] * pdt;
          pRot[i] += pSpin[i] * pdt;
          pFl[i] += pFs[i] * pdt;
          const landY = 760 + i * 37 % 140;
          if (pX[i] > 300 && pX[i] < 920 && pY[i] > landY && pY[i] < landY + 30 && !burst) pLand[i] = 1e-3;
          if (pY[i] > box.y1 + 40 || pX[i] > box.x1 + 160 || pX[i] < box.x0 - 160) {
            pLife[i] = 0;
            if (!burst) spawnPetal(i, box, true);
          }
        }
        if (ptr.over && !reduce && Math.hypot(ptr.vx, ptr.vy) > 5) {
          const k = clamp(pp.strength, 0, 10) / 5 * 0.9;
          for (let i = 0; i < pX.length; i++) {
            if (pLife[i] <= 0 || pLand[i] > 0) continue;
            const d = Math.hypot(pX[i] - ptr.wx, pY[i] - ptr.wy);
            if (d > reachW * 1.2) continue;
            const w = (1 - d / (reachW * 1.2)) ** 2;
            pVX[i] += ptr.vx * w * k * Math.min(1, dt * 12);
            pVY[i] += ptr.vy * w * k * Math.min(1, dt * 12);
            pSpin[i] += (pr() - 0.5) * w * 2;
          }
        }
      }
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.globalCompositeOperation = "source-over";
      ctx.globalAlpha = 1;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (!L) return;
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = "high";
      const kb = kBuf * s;
      ma = kb * ca;
      mb = kb * sa;
      mc = -kb * sa;
      md = kb * ca;
      ox0 = Cx * kBuf;
      oy0 = Cy * kBuf;
      snap = !ang;
      blit(L.sky);
      for (const [l, off] of [
        [L.cloudsFar, cloudFar],
        [L.cloudsNear, cloudNear]
      ]) {
        if (l.pat === void 0) {
          l.pat = ctx.createPattern(l.cv, "repeat-x");
          if (l.pat) l.pat.setTransform(new DOMMatrix([1 / l.res, 0, 0, 1 / l.res, l.box.x0, l.box.y0]));
        }
        if (!l.pat) continue;
        const o = (off % CLOUD_PER + CLOUD_PER) % CLOUD_PER;
        setWorld(o, 0);
        ctx.fillStyle = l.pat;
        ctx.fillRect(box.x0 - o, l.box.y0, box.x1 - box.x0, l.cv.height / l.res);
      }
      blit(L.castle);
      const rays = clamp(adv.rays / 100, 0, 1);
      if (rays > 0) {
        ctx.globalCompositeOperation = "screen";
        setWorld();
        const shaft = L.shaft;
        for (let i = 0; i < 6; i++) {
          const a = (-0.42 + i * 0.16) * (1 + 0.05 * Math.sin(t * 0.1 + i));
          const len = 720, wd = 60 + i * 37 % 50;
          const al = rays * 0.32 * (0.55 + 0.45 * Math.sin(t * (0.21 + i * 0.03) + i * 1.7));
          if (al <= 3e-3) continue;
          ctx.globalAlpha = al;
          local(600 + i * 8, 70, a, 1);
          ctx.drawImage(shaft, -wd / 2, 0, wd, len);
        }
        ctx.globalAlpha = 1;
      }
      const nm = Math.round(clamp(adv.motes, 0, 100));
      if (nm > 0) {
        ctx.globalCompositeOperation = "lighter";
        setWorld();
        const ms = L.mote;
        for (let i = 0; i < nm; i++) {
          const ph = mP[i] + t * 0.35 * mS[i];
          const x = mX[i] + Math.sin(ph) * 26 + Math.sin(ph * 0.37) * 40;
          const y = 110 + ((mY[i] - 110 - t * 9 * mS[i]) % 600 + 600) % 600;
          const tw = 0.5 + 0.5 * Math.sin(ph * 2.3);
          ctx.globalAlpha = (0.15 + 0.5 * tw) * clamp(Math.min(y - 110, 710 - y) / 60);
          const sz = 0.18 + 0.22 * mS[i];
          ctx.drawImage(ms.cv, x + ms.ox * sz, y + ms.oy * sz, ms.w * sz, ms.h * sz);
        }
        ctx.globalAlpha = 1;
      }
      ctx.globalCompositeOperation = "source-over";
      blit(L.arch);
      setWorld();
      const sway = adv.swayAngle * DEG * breezeK;
      for (let i = 0; i < NR; i++) {
        const [ax, ay, len] = RACEMES[i];
        const wind = sway * (0.65 * Math.sin(t * 0.9 + rPh[i]) + 0.35 * Math.sin(t * 2.1 + rPh[i] * 1.7)) * (0.7 + len / 400);
        const th = wind - sway * 0.35 * windDir + rTh[i];
        let x = ax, y = ay, a = 0;
        const segs = L.racemes[i];
        for (let s3 = 0; s3 < 3; s3++) {
          a += th * (s3 === 0 ? 1 : 0.55);
          const sp = segs[s3];
          local(x, y, a, 1);
          ctx.drawImage(sp.cv, sp.ox, sp.oy, sp.w, sp.h);
          x += -Math.sin(a) * (len / 3);
          y += Math.cos(a) * (len / 3);
        }
      }
      blit(L.bush);
      const ps = L.petals;
      setWorld();
      for (let i = 0; i < pX.length; i++) {
        if (pLife[i] <= 0) continue;
        const z = pZ[i];
        const sp = ps[pK[i]];
        const al = (pLand[i] > 0 ? clamp(1 - pLand[i] / 2.2) : 1) * (i >= PETAL_MAX ? clamp(pLife[i] * 4) : 1);
        ctx.globalAlpha = al;
        local(pX[i], pY[i], pRot[i], 0.25 + 0.75 * Math.abs(Math.cos(pFl[i] * 0.5)));
        const sc = v.petalSize / (v.petalSize * 1.25) * z;
        ctx.drawImage(sp.cv, sp.ox * sc, sp.oy * sc, sp.w * sc, sp.h * sc);
      }
      ctx.globalAlpha = 1;
    };
    wake();
  }
  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", init);
  } else {
    init();
  }
})();

</script>
</body>
