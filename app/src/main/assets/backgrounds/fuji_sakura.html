<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fuji and Sakura – 9:16 Pixel Hanging Scroll</title>
<style>
  :root {
    --ground: #11100d;
    --paper: #eadfc8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background: var(--ground);
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    pointer-events: none;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
    object-fit: cover;
    background: var(--paper);
    image-rendering: -moz-crisp-edges;
    image-rendering: -webkit-crisp-edges;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    pointer-events: none;
  }
</style>
</head>
<body>
<canvas id="c" aria-label="Animated 9:16 pixel art Japanese hanging scroll: snow-capped Mount Fuji above golden mist and a still lake with a pagoda, torii gate, fishing boat, koi fish, cranes, sakura tree, sleeping cat, and drifting petals"></canvas>
<script>
(() => {
  // 9:16 True Pixel Buffer Resolution (162 x 288)
  const W = 162, H = 288, SHORE = 198, TAU = Math.PI * 2;
  const FUJI_X = 83, FUJI_TOP = 82, FUJI_BASE = 178;

  const cv = document.getElementById('c');
  cv.width = W;
  cv.height = H;
  const ctx = cv.getContext('2d', { alpha: false });
  const img = ctx.createImageData(W, H);
  const px = new Uint32Array(img.data.buffer);
  const bg = new Uint32Array(W * H);

  // Convert 0xRRGGBB hex into ABGR 32-bit integer for little-endian ImageData buffer
  const C = h => ((255 << 24) | ((h & 255) << 16) | (h & 0xff00) | ((h >> 16) & 255)) >>> 0;
  const mk = o => Object.fromEntries(Object.entries(o).map(([k, v]) => [k, C(v)]));

  // Unpack & blend ABGR colors for water reflections and translucent mist washes
  const blend = (c1, c2, a) => {
    const r1 = c1 & 255, g1 = (c1 >> 8) & 255, b1 = (c1 >> 16) & 255;
    const r2 = c2 & 255, g2 = (c2 >> 8) & 255, b2 = (c2 >> 16) & 255;
    const r = (r1 + (r2 - r1) * a) | 0;
    const g = (g1 + (g2 - g1) * a) | 0;
    const b = (b1 + (b2 - b1) * a) | 0;
    return ((255 << 24) | (b << 16) | (g << 8) | r) >>> 0;
  };

  // 4x4 Ordered Bayer Dithering Matrix & Helpers
  const BAY = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
  const bay = (x, y) => (BAY[(y & 3) * 4 + (x & 3)] + 0.5) / 16;
  const ramp = (s, f, x, y) => {
    f = f < 0 ? 0 : f > 1 ? 1 : f;
    const t = f * (s.length - 1), i = Math.min(s.length - 2, Math.floor(t));
    return bay(x & 255, y & 255) < t - i ? s[i + 1] : s[i];
  };

  // Deterministic Spatial Hash & Seeded PRNG
  const hash = (x, y) => {
    let h = Math.imul(x, 374761393) + Math.imul(y, 668265263);
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
  };
  function rng(seed) {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = Math.imul(a ^ (a >>> 15), a | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  const rnd = rng(2026);

  // Buffer Drawing Primitives
  const bset = (x, y, c) => {
    x = Math.round(x);
    y = Math.round(y);
    if (x >= 0 && x < W && y >= 0 && y < H) bg[y * W + x] = c;
  };
  const rect = (x, y, w, h, c) => {
    for (let j = y; j < y + h; j++)
      for (let i = x; i < x + w; i++)
        if (i >= 0 && i < W && j >= 0 && j < H) bg[j * W + i] = c;
  };
  const set = (x, y, c) => {
    x = Math.round(x);
    y = Math.round(y);
    if (x >= 0 && x < W && y >= 0 && y < H) px[y * W + x] = c;
  };
  const drect = (x, y, w, h, c) => {
    for (let j = 0; j < h; j++)
      for (let i = 0; i < w; i++)
        set(x + i, y + j, c);
  };
  const halo = (x, y, w, h, r, c, k) => {
    for (let j = -r; j < h + r; j++) {
      for (let i = -r; i < w + r; i++) {
        const dx = i < 0 ? -i : i >= w ? i - w + 1 : 0;
        const dy = j < 0 ? -j : j >= h ? j - h + 1 : 0;
        const d = Math.hypot(dx, dy);
        if (d > 0 && d < r && bay((x + i) & 255, (y + j) & 255) < (1 - d / r) * k) {
          set(x + i, y + j, c);
        }
      }
    }
  };

  // Multi-harmonic mountain ridge generator
  function ridgeFn(seed, base, amp) {
    const r = rng(seed), comps = [];
    for (let k = 0; k < 5; k++) {
      comps.push({
        f: 0.023 * Math.pow(1.85, k) * (0.8 + r() * 0.4),
        a: amp * Math.pow(0.5, k),
        p: r() * TAU
      });
    }
    return x => {
      let s = 0;
      for (let k = 0; k < comps.length; k++) {
        s += comps[k].a * (0.5 + 0.5 * Math.sin(comps[k].f * x + comps[k].p));
      }
      return base - s;
    };
  }

  /* =========================================================================
   * 1. PRE-RENDER STATIC SCENE INTO `bg` (SKY, SUN, FUJI, RIDGES, PAGODA, TORII)
   * ========================================================================= */
  const INK = C(0x1d2022), INK_SOFT = C(0x2f353a), PAPER = C(0xeadfc8);
  const SKY = [
    0x7e94a8, // Upper mineral slate-indigo
    0x9eb0be, // Cool celadon grey-blue
    0xc0cac8, // Pale mineral mist
    0xdcd4c2, // Warm aged washi
    0xead2bc, // Soft peach-gold horizon wash
    0xf2dfc8  // Golden-cream lower sky
  ].map(C);

  for (let y = 0; y < SHORE; y++) {
    for (let x = 0; x < W; x++) {
      let f = Math.pow(y / SHORE, 1.08);
      // Subtle horizontal sumi wash streaks
      const wash = Math.sin(y * 0.35 + Math.sin(x * 0.06) * 2) * 0.025;
      let col = ramp(SKY, f + wash, x, y);
      // Washi paper grain flecks
      if (hash(x * 3, y * 5) < 0.04) col = blend(col, C(0xd4c4a8), 0.35);
      bg[y * W + x] = col;
    }
  }

  // Giant Vermilion Rising Sun (Hinomaru) + Multi-Ring Dithered Atmospheric Halo
  const SX0 = 124, SY0 = 64, SR = 15.2;
  const SUN_HALO = [C(0xd96b52), C(0xe68d6c), C(0xedb08e)];
  const SUN_CORE = [C(0xb83628), C(0xc94532), C(0xd85640)];
  for (let y = Math.max(0, SY0 - 44); y < Math.min(SHORE, SY0 + 44); y++) {
    for (let x = Math.max(0, SX0 - 44); x < Math.min(W, SX0 + 44); x++) {
      const d = Math.hypot(x - SX0, y - SY0);
      if (d <= SR) {
        // Slightly mottled mineral vermilion sun disc
        const sf = Math.hypot(x - (SX0 - 3), y - (SY0 - 3)) / (SR * 1.35);
        bg[y * W + x] = ramp(SUN_CORE, 1 - sf, x, y);
      } else if (d < SR * 2.8) {
        const hf = 1 - (d - SR) / (SR * 1.8);
        if (bay(x, y) < hf * 0.55) {
          bg[y * W + x] = SUN_HALO[hf > 0.66 ? 0 : hf > 0.33 ? 1 : 2];
        }
      }
    }
  }

  // Mount Fuji Volcanic Silhouette & Snow Cap
  const halfFuji = (dy, side) =>
    (5.5 + 118 * Math.pow(dy, 1.62)) * (side < 0 ? 0.97 : 1.04) +
    Math.sin(dy * 23) * 0.4 + Math.sin(dy * 53) * 0.2;

  const snowline = x =>
    118 +
    5.6 * Math.sin((x - FUJI_X) * 0.14) +
    4.4 * Math.sin((x - FUJI_X) * 0.44 + 1.3) +
    2.6 * Math.sin(x * 1.15);

  const FUJI_BODY = [C(0x9ab0c4), C(0x748ca6), C(0x526b88), C(0x39506a), C(0x283a50)];
  const FUJI_SNOW = [C(0xbecbd8), C(0xe4eaec), C(0xfbf4eb), C(0xf6d5c4)];

  for (let y = FUJI_TOP; y <= FUJI_BASE; y++) {
    const dy = (y - FUJI_TOP) / (FUJI_BASE - FUJI_TOP);
    const xl = Math.round(FUJI_X - halfFuji(dy, -1));
    const xr = Math.round(FUJI_X + halfFuji(dy, 1));

    for (let x = Math.max(0, xl); x <= Math.min(W - 1, xr); x++) {
      const sl = snowline(x) + (((x >> 1) % 3 === 0) ? 2.2 : 0);
      const horiz = (x - xl) / Math.max(1, xr - xl); // 0 = left shadow, 1 = right sunlit flank

      // Extra descending snow gullies / ribs below main snowline
      const rib = Math.sin((x - FUJI_X) * (0.36 - dy * 0.12) + 0.7);
      const inGully = y < sl + 14 && rib > 0.52 && bay(x, y) < (1 - (y - sl) / 14);

      if (y <= sl || inGully) {
        // Snow cap shaded from cool blue-grey left to warm sunlit cream-peach right
        let c = ramp(FUJI_SNOW, horiz * 0.95, x, y);
        // Indigo snow crevasse lines radiating from summit
        const crev = Math.sin((x - FUJI_X) * (0.45 - dy * 0.18) + 1.9);
        if (y > FUJI_TOP + 4 && crev > 0.76 && bay(x, y) < 0.65) {
          c = C(0x587292);
        }
        bg[y * W + x] = c;
      } else {
        // Volcanic rock slope
        let c = ramp(FUJI_BODY, dy, x, y);
        // Left cool shadow vs Right warm vermilion-sunlit rim
        if (horiz < 0.28 && bay(x, y) < (0.28 - horiz) * 2.2) {
          c = blend(c, C(0x1f304c), 0.45);
        } else if (horiz > 0.68 && bay(x, y) < (horiz - 0.68) * 2.1) {
          c = blend(c, C(0xe89678), 0.38);
        }
        // Lower volcanic ridge streaks
        if (rib > 0.62 && bay(x, y) < 0.45) {
          c = blend(c, C(0x1c2a40), 0.4);
        } else if (rib < -0.68 && bay(x, y) < 0.4) {
          c = blend(c, C(0x9cb2cc), 0.35);
        }
        bg[y * W + x] = c;
      }
    }
    // Crisp sumi-ink mountain contour lines on left & right slopes
    if (xl >= 0 && xl < W && hash(xl, y) < 0.78) bg[y * W + xl] = C(0x2c3844);
    if (xr >= 0 && xr < W && hash(xr, y) < 0.78) bg[y * W + xr] = C(0x2c3844);
  }
  // Summit crater ink cap line
  rect(Math.round(FUJI_X - halfFuji(0, -1)), FUJI_TOP, Math.round(halfFuji(0, -1) + halfFuji(0, 1) + 1), 1, C(0x2c3844));

  // Layered Distant Mountain Ridges & Tiny Sumi Pine Silhouettes
  function drawRidge(seed, base, amp, cTop, cBot, pineCount, blossomChance) {
    const fn = ridgeFn(seed, base, amp);
    const r = rng(seed * 7);
    const cols = [C(cTop), C(cBot)];
    for (let x = 0; x < W; x++) {
      const ry = Math.round(fn(x));
      for (let y = Math.max(0, ry); y < SHORE; y++) {
        bg[y * W + x] = ramp(cols, (y - ry) / Math.max(1, SHORE - ry), x, y);
      }
    }
    // Tiny sumi-ink pine trees along the ridge crest
    for (let k = 0; k < pineCount; k++) {
      const tx = Math.floor(r() * W);
      const ty = Math.round(fn(tx)) + 1;
      const th = 3 + Math.floor(r() * 4);
      const pcol = C(cTop === 0x1e2c3a ? 0x141c24 : 0x243444);
      for (let h = 0; h < th; h++) bset(tx, ty - h, pcol);
      for (let h = 1; h < th; h += 2) {
        const bw = h === th - 1 ? 1 : 2;
        for (let dx = -bw; dx <= bw; dx++) bset(tx + dx, ty - h, pcol);
      }
      // Distant hillside sakura blossom puffs
      if (blossomChance > 0 && r() < blossomChance) {
        const bx = tx + Math.round((r() - 0.5) * 4);
        const by = ty + Math.floor(r() * 3);
        bset(bx, by, C(0xe6aab8));
        bset(bx + 1, by, C(0xf2cad4));
        bset(bx, by - 1, C(0xf2cad4));
      }
    }
    return fn;
  }

  drawRidge(5, 173, 9, 0x526882, 0x6c8096, 0, 0);
  const midRidge = drawRidge(9, 188, 12, 0x32465c, 0x485c72, 28, 0.25);

  // Easter Egg #1: Chureito Five-Story Crimson Pagoda (五重塔) on the Right Ridge
  {
    const px0 = 135, pyBase = Math.round(midRidge(px0)) + 2;
    // Golden finial spire (Sorin)
    for (let y = pyBase - 24; y < pyBase - 19; y++) bset(px0, y, C(0xd8a848));
    bset(px0, pyBase - 25, C(0xf6dc86));
    // 5 curved pagoda tiers
    for (let tier = 0; tier < 5; tier++) {
      const ty = pyBase - 19 + tier * 4;
      const rw = 3 + (tier >> 1); // roof half-width
      const bw = Math.max(1, rw - 2); // crimson body half-width
      // Dark sumi-ink roof with upturned eaves
      for (let dx = -rw; dx <= rw; dx++) {
        const curve = Math.abs(dx) === rw ? -1 : 0;
        bset(px0 + dx, ty + curve, INK);
        if (Math.abs(dx) < rw) bset(px0 + dx, ty + 1, C(0x2c3238));
      }
      // Vermilion walls & warm window glint
      for (let dx = -bw; dx <= bw; dx++) {
        bset(px0 + dx, ty + 2, dx === 0 ? C(0xf2d8a8) : C(0xb8382a));
        bset(px0 + dx, ty + 3, C(0x982a20));
      }
    }
    // Blossom clouds hugging the pagoda base
    const pBlossoms = [[-5, -2], [-4, -3], [4, -1], [5, -2], [-3, 0], [3, 0]];
    for (const [dx, dy] of pBlossoms) {
      bset(px0 + dx, pyBase + dy, C(0xebb4c0));
      bset(px0 + dx + 1, pyBase + dy, C(0xd8889a));
    }
  }

  // Near Shoreline Ridge
  drawRidge(14, 196, 6, 0x1f2d3c, 0x2c3d4e, 36, 0.42);

  // Easter Egg #2: Lakeside Vermilion Water Torii Gate (水上鳥居) on Left-Center Shore
  {
    const tx = 38, ty = SHORE - 1;
    const V_RED = C(0xc83a2a), V_DARK = C(0x8e2418);
    // Two vertical pillars in the shallow water
    for (let y = ty - 9; y <= ty; y++) {
      bset(tx - 3, y, y >= ty - 1 ? INK : V_RED);
      bset(tx + 3, y, y >= ty - 1 ? INK : V_RED);
    }
    // Lower tie beam (Nuki)
    for (let x = tx - 4; x <= tx + 4; x++) bset(x, ty - 7, V_DARK);
    // Upper curved lintel (Kasagi) with upturned ink tips
    for (let x = tx - 6; x <= tx + 6; x++) {
      const up = Math.abs(x - tx) >= 5 ? -1 : 0;
      bset(x, ty - 10 + up, INK);
      bset(x, ty - 9 + up, V_RED);
    }
    // Center tablet (Gakuzuka)
    bset(tx, ty - 8, C(0xe8c878));
  }

  // Top-Right Hanging Scroll Vertical Calligraphy Cartouche (短冊 / 題簽)
  {
    const cx = 148, cy = 10, cw = 9, ch = 32;
    rect(cx, cy, cw, ch, C(0x2a2420));
    rect(cx + 1, cy + 1, cw - 2, ch - 2, C(0xd86248)); // Vermilion-gold silk border
    rect(cx + 2, cy + 2, cw - 4, ch - 4, C(0xf4ead8)); // Washi cartouche interior
    // Pixel kanji strokes inside cartouche (富 嶽 櫻)
    const glyphs = [
      [4, 5], [3, 6], [4, 6], [5, 6], [3, 8], [5, 8], [4, 9], [3, 10], [5, 10],
      [4, 13], [3, 14], [5, 14], [4, 15], [3, 17], [4, 17], [5, 17], [4, 18],
      [3, 21], [5, 21], [4, 22], [3, 23], [4, 24], [5, 24], [3, 26], [5, 26]
    ];
    for (const [gx, gy] of glyphs) bset(cx + gx, cy + gy, INK);
  }

  /* =========================================================================
   * 2. PROCEDURAL FOREGROUND SAKURA TREE, SHORE BANK & WINDSWEPT PINE
   * ========================================================================= */
  // Store tree bark, blossom clusters, and foreground shore into sparse pixel arrays for fast swaying
  const trunkPixels = [];
  const blossomClusters = [];
  const foreBank = new Uint32Array(W * H); // 0 = transparent

  const fset = (x, y, c) => {
    x = Math.round(x);
    y = Math.round(y);
    if (x >= 0 && x < W && y >= 0 && y < H) foreBank[y * W + x] = c;
  };

  // Build Gnarled Left Sakura Tree & Overhanging Upper Bough
  {
    const trng = rng(2468);
    const barkMap = new Uint32Array(W * H);
    const tips = [], mids = [];

    function brush(x0, y0, cx, cy, x1, y1, w0, w1) {
      const steps = Math.max(12, Math.ceil(Math.hypot(x1 - x0, y1 - y0) * 1.8));
      for (let i = 0; i <= steps; i++) {
        const t = i / steps, u = 1 - t;
        const x = u * u * x0 + 2 * u * t * cx + t * t * x1;
        const y = u * u * y0 + 2 * u * t * cy + t * t * y1;
        const rad = Math.max(0.55, (w0 + (w1 - w0) * t) * 0.5);
        const rCeil = Math.ceil(rad);
        for (let dy = -rCeil; dy <= rCeil; dy++) {
          for (let dx = -rCeil; dx <= rCeil; dx++) {
            if (Math.hypot(dx, dy) <= rad) {
              const px = Math.round(x + dx), py = Math.round(y + dy);
              if (px >= 0 && px < W && py >= 0 && py < H) {
                // Sumi-ink bark with dry-brush (kasure) highlight streaks on right side of trunk
                const kasure = rad > 2.2 && dx > 0 && hash(px, py) < 0.22;
                barkMap[py * W + px] = kasure ? C(0x524c44) : (dx < -rad * 0.3 ? C(0x141618) : INK);
              }
            }
          }
        }
      }
    }

    function grow(x, y, ang, len, w, depth, maxD, lean, ymax) {
      const x1 = x + Math.cos(ang) * len;
      const y1 = y + Math.sin(ang) * len;
      const mx = (x + x1) * 0.5, my = (y + y1) * 0.5;
      const nx = -Math.sin(ang), ny = Math.cos(ang);
      const bend = (trng() - 0.5) * len * 0.45;
      const cx = mx + nx * bend, cy = my + ny * bend + (depth >= 3 ? len * 0.1 : 0);
      const wEnd = Math.max(0.8, w * 0.64);
      brush(x, y, cx, cy, x1, y1, w, wEnd);
      tips.push({ x: x1, y: y1, d: depth });
      mids.push({ x: cx, y: cy, d: depth });
      if (depth >= maxD) return;
      const nc = depth === 0 ? 3 : (trng() < 0.28 ? 3 : 2);
      const spread = depth === 0 ? 0.78 : 0.68;
      for (let c = 0; c < nc; c++) {
        let a = ang + (c - (nc - 1) / 2) * spread + (trng() - 0.5) * 0.38 + lean;
        if (y1 > ymax && Math.sin(a) > 0) continue;
        const sa = Math.sin(a);
        if (sa > 0.5) a -= (sa - 0.5) * 0.9;
        grow(x1, y1, a, len * (0.71 + trng() * 0.08), wEnd, depth + 1, maxD, lean, ymax);
      }
    }

    // Main Gnarled Sakura Trunk rising from left foreground bank
    brush(18, 276, 13, 260, 17, 244, 11.5, 8.8);
    // Root flare on shore bank
    brush(8, 280, 14, 272, 18, 264, 7.0, 5.0);
    brush(29, 281, 22, 272, 18, 264, 6.5, 4.5);

    grow(17, 244, -Math.PI / 2 + 0.28, 43, 8.4, 0, 5, 0.05, 242);
    grow(18, 238, -Math.PI / 2 - 0.52, 29, 4.2, 1, 5, 0.04, 242);
    // Upper-left overhanging bough
    grow(-10, 8, 0.34, 36, 4.0, 0, 4, 0.02, 288);

    // Pack bark pixels into a fast sparse list with sway weights
    for (let y = 0; y < H; y++) {
      for (let x = 0; x < W; x++) {
        const c = barkMap[y * W + x];
        if (c) {
          const swayWeight = y < 120 ? (x + 12) / 95 : Math.max(0, (255 - y) / 150);
          trunkPixels.push({ x, y, c, w: swayWeight });
        }
      }
    }

    // Generate 6-tone Bayer-dithered Sakura Blossom Clusters on branch tips & mids
    const SAKURA_PAL = [
      C(0xb85c74), // Deep rose-carmine core shadow
      C(0xd68498), // Mid mineral blossom pink
      C(0xe6a6b4), // Classic sakura petal pink
      C(0xf0c2cc), // Soft sunlit blossom
      C(0xf7dce2), // Pale blush
      C(0xfcf2f4)  // Crisp white-pink highlight
    ];
    const STAMEN = C(0x8c2d48);

    function addCluster(cx, cy, rad) {
      if (cx > 106) return;
      const pts = [];
      const rCeil = Math.ceil(rad);
      for (let dy = -rCeil; dy <= rCeil; dy++) {
        for (let dx = -rCeil; dx <= rCeil; dx++) {
          const d = Math.hypot(dx, dy * 1.18);
          if (d <= rad) {
            const norm = d / rad;
            // Rich organic edge breakup using Bayer + spatial hash
            if (norm > 0.72 && bay((cx + dx) & 255, (cy + dy) & 255) > (1 - norm) * 3.4) continue;
            // Shade from upper-right sunlit cream-pink to lower-left rose shadow
            const light = ((dx - dy * 0.8) / rad) * 0.5 + 0.5;
            let col = ramp(SAKURA_PAL, Math.min(1, Math.max(0, light * 0.85 + hash(cx + dx, cy + dy) * 0.25)), cx + dx, cy + dy);
            // Tiny dark carmine flower centers scattered through the cluster
            if (hash(cx + dx * 7, cy + dy * 11) < 0.045) col = STAMEN;
            pts.push({ dx, dy, c: col });
          }
        }
      }

  // Build Foreground Left Bank, Mossy Stone Lantern, Right-Shore Matsu Pine & Reeds

    // Windswept Right-Shore Matsu Pine (松) Framing the Right Side
    function fbrush(x0, y0, cx, cy, x1, y1, w0, w1) {

      for (let i = 0; i <= steps; i++) {
        const t = i / steps, u = 1 - t;
        const x = u * u * x0 + 2 * u * t * cx + t * t * x1;
        const y = u * u * y0 + 2 * u * t * cy + t * t * y1;
        const rad = Math.max(0.5, (w0 + (w1 - w0) * t) * 0.5);
        const rC = Math.ceil(rad);
        for (let dy = -rC; dy <= rC; dy++) {
          for (let dx = -rC; dx <= rC; dx++) {
            if (Math.hypot(dx, dy) <= rad) {
              fset(x + dx, y + dy, dx > 0 && hash(x + dx, y + dy) < 0.25 ? C(0x3a322c) : INK);
            }

            fset(cx + dx, cy + dy, c);
          }
        }
      }
    }
    pinePad(bx - 3, by - 37, 14, 5);
    pinePad(bx - 25, by - 17, 11, 4);
    pinePad(bx + 16, by - 29, 11, 4);
    pinePad(bx - 12, by - 27, 9, 3);

  /* =========================================================================
   * 4. HELPER RENDERING ROUTINES FOR LAYERED ELEMENTS

  // Draw dithered horizontal cloud band or soft morning mist strip
  function drawCloudLayer(layer, t) {
    const r = rng(layer.seed);
    const puffs = [];
    for (let i = 0; i < 5; i++) {
      puffs.push({
        cx: r() * W,
        cy: layer.y + (r() - 0.5) * layer.h * 0.55,
        rx: 26 + r() * 36,
        ry: layer.gold ? (2.5 + r() * 3.2) : (5.5 + r() * 7.5)
      });
    }
    const shift = ((t * layer.sp) % W + W) % W;
    const cCore = layer.gold ? C(0xf6e8c8) : C(0xf4ece0);
    const cEdge = layer.gold ? C(0xe6cfa4) : C(0xe4dacc);
    const cRim = C(0xc8a064);

    const y0 = Math.max(0, Math.floor(layer.y - layer.h));
    const y1 = Math.min(SHORE - 1, Math.ceil(layer.y + layer.h));

    for (let y = y0; y <= y1; y++) {
      for (let x = 0; x < W; x++) {
        let dMin = 99;
        for (let p = 0; p < puffs.length; p++) {
          const pf = puffs[p];
          let dx = (x - (pf.cx + shift)) % W;
          if (dx < -W * 0.5) dx += W;
          if (dx > W * 0.5) dx -= W;
          const dy = y - pf.cy;
          const d = Math.hypot(dx / pf.rx, dy / pf.ry);
          if (d < dMin) dMin = d;
        }
        if (dMin < 1.0) {
          const strength = (1 - dMin) * layer.a;
          if (bay(x, y) < strength) {
            px[y * W + x] = dMin < 0.55 ? cCore : cEdge;
          } else if (layer.gold && dMin > 0.78 && dMin < 0.96 && y > layer.y && bay(x, y) < 0.25) {
            px[y * W + x] = cRim;
          }
        }
      }
    }
  }

  // Draw animated pixel Red-Crowned Crane (Tanchōzuru)
  function drawCrane(x, y, flap, small) {
    const cx = Math.round(x), cy = Math.round(y);
    const WHITE = C(0xfaf6ec), WING_TIP = INK, CROWN = C(0xd83228);
    const wy = Math.round(flap * 2.2);
    if (small) {
      set(cx, cy, WHITE);
      set(cx - 1, cy, CROWN);
      set(cx - 2, cy + wy, WHITE);
      set(cx + 2, cy + wy, WHITE);
      set(cx - 3, cy + wy, WING_TIP);
      set(cx + 3, cy + wy, WING_TIP);
    } else {
      // Body & outstretched neck
      set(cx, cy, WHITE);
      set(cx + 1, cy, WHITE);
      set(cx - 1, cy, WHITE);
      set(cx - 2, cy - 1, CROWN); // Red crown
      set(cx - 3, cy - 1, INK);   // Beak
      set(cx + 2, cy + 1, WING_TIP); // Tail feathers
      // Arched wings flapping
      for (let s = 1; s <= 4; s++) {
        const dy = s <= 2 ? Math.round(-flap * s * 0.8) : Math.round(flap * (s - 1.5) * 0.9);
        const col = s === 4 ? WING_TIP : WHITE;
        set(cx - s, cy + dy, col);
        set(cx + s, cy + dy, col);
      }
    }
  }

  /* =========================================================================

  function render(t, dt, revealProgress) {
    // 1. Copy static sky, sun, Fuji, ridges, pagoda & torii gate into active buffer
    px.set(bg);

    // 2. High Golden Cloud Band + Flying Cranes
    drawCloudLayer(bands[0], t);
    for (let i = 0; i < cranes.length; i++) {
      const c = cranes[i];
      c.x -= c.sp * dt;
      if (c.x < -12) c.x = W + 12;
      const by = c.y + Math.sin(t * 0.8 + c.ph) * 2.2;
      drawCrane(c.x, by, Math.sin(t * 3.4 + c.ph), c.sc === 0);
    }

    // 3. Mid & Low Golden Cloud Bands + Morning Mist Strips over Mount Fuji's base
    drawCloudLayer(mists[0], t);
    drawCloudLayer(bands[1], t);
    drawCloudLayer(mists[1], t);
    drawCloudLayer(bands[2], t);
    drawCloudLayer(mists[2], t);

    // 4. Real-Time Scanline Lake Reflection (Mirrors Sky, Sun, Fuji, Clouds, Pagoda & Torii)
    const WATER_TOP = C(0x9eb0b8), WATER_DEEP = C(0x3b5266);
    for (let y = SHORE; y < H; y++) {
      const d = y - SHORE;
      const depthF = d / (H - SHORE);
      const srcY = Math.max(0, Math.min(SHORE - 1, Math.round(SHORE - 1 - d * 1.05)));
      const waveShift = Math.round(Math.sin(t * 2.1 + d * 0.28) * (0.8 + depthF * 2.4));
      const baseWater = ramp([WATER_TOP, C(0x6e8596), WATER_DEEP], depthF, 0, y);

      for (let x = 0; x < W; x++) {
        const sx = Math.max(0, Math.min(W - 1, x + waveShift));
        const reflCol = px[srcY * W + sx];
        // Blend mirrored scene with lake depth gradient
        const reflStrength = Math.max(0.16, 0.62 * (1 - depthF * 0.85));
        px[y * W + x] = blend(baseWater, reflCol, reflStrength);
      }
    }

    // Shimmering Washi Water Wave Lines & Vermilion Sun Glint Column on Lake
    for (let k = 0; k < 22; k++) {
      const ly = SHORE + 3 + k * 4 + Math.round(Math.sin(t * 0.6 + k) * 0.6);
      if (ly >= H) continue;
      const lx = ((k * 37) % 130) + Math.round(Math.sin(t * 0.4 + k * 1.3) * 4);
      const ll = 12 + ((k * 19) % 28);
      const glint = Math.sin(t * 1.1 + k) > 0;
      for (let i = 0; i < ll; i++) {
        if (bay(lx + i, ly) < (glint ? 0.45 : 0.25)) {
          set(lx + i, ly, C(0xf4ece0));
        }
      }
    }
    // Vermilion Sun Reflection Shimmer Bars under SX0 (x = 124)
    for (let k = 0; k < 15; k++) {
      const gy = SHORE + 5 + k * 4;
      const gw = 2 + Math.floor(k * 0.35 + Math.sin(t * 1.4 + k) * 1.2);
      const gx = SX0 + Math.round(Math.sin(t * 0.9 + k * 0.7) * 1.5);
      for (let dx = -gw; dx <= gw; dx++) {
        if (bay(gx + dx, gy) < 0.65 - k * 0.03) {
          set(gx + dx, gy, k % 2 === 0 ? C(0xd96b52) : C(0xedb08e));
        }
      }
    }

    // 5. Swimming Kohaku Koi Fish & Concentric Water Ripples
    for (let i = 0; i < koiList.length; i++) {
      const k = koiList[i];
      k.x += k.vx * dt;
      k.y += Math.sin(t * 1.2 + k.ph) * 0.35 * dt * 10;
      if (k.x < 18) { k.x = 18; k.vx = Math.abs(k.vx); }
      if (k.x > 142) { k.x = 142; k.vx = -Math.abs(k.vx); }
      const dir = k.vx >= 0 ? 1 : -1;
      const kx = Math.round(k.x), ky = Math.round(k.y);
      const wag = Math.round(Math.sin(t * 7 + k.ph));
      // Koi head, white body, vermilion pattern, and wagging tail
      set(kx, ky, C(0xf4ede2));
      set(kx - dir, ky, C(0xd8462a));
      set(kx - dir * 2, ky + (wag > 0 ? 1 : 0), C(0xf4ede2));
      set(kx - dir * 3, ky + wag, C(0xd8462a));
      if (hash(Math.floor(t * 3), i) < 0.015 && ripples.length < 6) {
        ripples.push({ x: kx, y: ky, r: 0.5, maxR: 6 });
      }
    }

    // Floating Sakura Petals on Lake Surface
    for (let i = 0; i < waterPetals.length; i++) {
      const wp = waterPetals[i];
      wp.x = (wp.x + wp.sp * dt + W) % W;
      const wy = Math.round(wp.y + Math.sin(t * 1.5 + wp.ph) * 0.5);
      set(wp.x, wy, wp.c);
    }

    // Floating Glowing Paper Water Lanterns (Tōrō nagashi)
    for (let i = 0; i < waterLanterns.length; i++) {

      const lx = Math.round(wl.x), ly = Math.round(wl.y + Math.sin(t * 1.8 + wl.ph) * 0.6);
      halo(lx - 1, ly - 2, 3, 3, 4, C(0xe89a48), 0.45);
      drect(lx - 1, ly, 3, 1, C(0x3a2418));       // Wooden base
      drect(lx - 1, ly - 2, 3, 2, C(0xffdfa0));   // Glowing paper sides
      set(lx, ly - 1, C(0xfff8dc));               // Warm candle heart
      // Warm reflection below lantern
      set(lx, ly + 2, C(0xe89a48));
      set(lx + (Math.sin(t * 4 + i) > 0 ? 1 : -1), ly + 3, C(0xd87a38));
    }

    // 6. Small Wooden Fishing Sampan Boat & Angler with Bamboo Rod
    {
      const bx = 86 + Math.round(Math.sin(t * 0.35) * 2.5);
      const by = 221 + Math.round(Math.sin(t * 1.4) * 0.6);
      // Subtle water shadow / wake under hull

        if (bay(bx + dx, by + 2) < 0.5) set(bx + dx, by + 2, C(0x243442));

      // Curved sampan hull
      for (let dx = -9; dx <= 9; dx++) {
        const curve = Math.abs(dx) >= 7 ? -1 : 0;
        set(bx + dx, by + curve, INK);
        if (Math.abs(dx) <= 7) set(bx + dx, by + 1 + curve, C(0x2c2622));

      // Seated angler silhouette in cloak & wide bamboo kasa hat
      drect(bx - 2, by - 4, 3, 4, INK);
      for (let dx = -3; dx <= 3; dx++) set(bx - 1 + dx, by - 5, C(0x322c24));
      set(bx - 1, by - 6, C(0x4a4236));
      // Warm glowing bow lantern hanging off the front of the boat
      const lx = bx - 9, ly = by - 2;
      halo(lx, ly, 1, 1, 4, C(0xe88a38), 0.5);
      set(lx, ly, C(0xffe8a8));
      set(lx, by + 3, C(0xe89a48));
      // Slender arched bamboo fishing rod & line dipping into water
      for (let s = 0; s <= 11; s++) {
        const rx = bx + 1 + s;
        const ry = by - 3 - Math.round(s * 0.85 - (s * s) * 0.025);
        set(rx, ry, INK);
      }
      const tipX = bx + 12, tipY = by - 9;
      for (let ly2 = tipY + 1; ly2 <= by + 2; ly2++) {
        if (bay(tipX, ly2) < 0.55) set(tipX, ly2, C(0xd8d0c0));
      }
      // Periodic fish nibble concentric ripples at the fishing line tip
      if (Math.floor(t * 2) % 9 === 0 && ripples.length < 5) {
        ripples.push({ x: tipX, y: by + 2, r: 0.5, maxR: 7.5 });
      }
    }

    // Update & Draw Concentric Water Ripple Rings
    ripples = ripples.filter(rp => (rp.r += dt * 3.8) < rp.maxR);
    for (const rp of ripples) {
      const fade = 1 - rp.r / rp.maxR;
      for (let a = 0; a < 16; a++) {
        const ang = (a / 16) * TAU;
        const rx = Math.round(rp.x + Math.cos(ang) * rp.r * 1.6);
        const ry = Math.round(rp.y + Math.sin(ang) * rp.r * 0.55);
        if (ry >= SHORE && bay(rx & 255, ry & 255) < fade * 0.75) {
          set(rx, ry, C(0xf4ece0));
        }
      }
    }

    // 7. Composite Foreground Shore Bank, Stone Lantern & Right-Shore Matsu Pine
    for (let i = 0; i < W * H; i++) {
      if (foreBank[i]) px[i] = foreBank[i];
    }

    // Animate flickering warm flame inside the Shore Stone Lantern (Ishidōrō)
    {
      const lx = 46, ly = 266;
      const flick = 0.75 + 0.25 * Math.sin(t * 11) * Math.cos(t * 6.3);
      halo(lx - 1, ly - 10, 3, 3, 7, C(0xe68a38), 0.45 * flick);
      drect(lx - 1, ly - 9, 3, 2, C(0xffce78));
      set(lx, ly - 8, C(0xfff6d8));
    }

    // Animate Sleeping Calico Cat curled up at the Sakura Tree Roots (x = 26, y = 269)
    {
      const cx = 26, cy = 269;
      const breath = Math.sin(t * 2.2) > 0.35 ? -1 : 0;
      const CAT_W = C(0xf6eee2), CAT_O = C(0xd8742a), CAT_B = C(0x282422), CAT_EAR = C(0xe694a4);
      // Curled loaf body
      for (let dy = -3; dy <= 0; dy++) {
        for (let dx = -4; dx <= 4; dx++) {
          if (Math.hypot(dx * 0.8, dy * 1.3) <= 3.3) {
            let col = CAT_W;
            if (dx < -1 && dy < -1) col = CAT_O;
            else if (dx > 1 && dy <= -1) col = CAT_B;
            set(cx + dx, cy + dy + (dy <= -2 ? breath : 0), col);
          }
        }
      }
      // Sleeping head tucked right & tiny pink ear
      set(cx + 3, cy - 3 + breath, CAT_W);
      set(cx + 2, cy - 4 + breath, CAT_EAR);
      set(cx + 4, cy - 4 + breath, CAT_O);
      // Gently curling tail on the left
      const tailWag = Math.round(Math.sin(t * 1.8) * 0.7);
      set(cx - 5, cy, CAT_B);
      set(cx - 6, cy - 1 + tailWag, CAT_B);
      // Floating pixel 'z' sleep bubbles
      zTimer += dt;
      if (zTimer > 2.2) {
        zTimer = 0;
        sleepZs.push({ x: cx + 4, y: cy - 6, a: 0 });
      }
      sleepZs = sleepZs.filter(z => (z.a += dt) < 2.0);
      for (const z of sleepZs) {
        const zx = Math.round(z.x + Math.sin(z.a * 3) * 1.2);
        const zy = Math.round(z.y - z.a * 4.5);
        if (bay(zx & 255, zy & 255) < 1.2 - z.a * 0.5) {
          set(zx, zy, C(0xfbf4eb));
          set(zx + 1, zy, C(0xfbf4eb));
          set(zx, zy + 1, C(0xfbf4eb));
          set(zx + 1, zy + 1, C(0xfbf4eb));
        }
      }
    }

    // Swaying Foreground Shore Reeds (Right Bottom)
    const gust = Math.sin(t * 0.45) * 0.5 + 0.5;
    for (let i = 0; i < reeds.length; i++) {
      const rd = reeds[i];
      const sway = Math.sin(t * 1.4 + rd.ph) * (1.2 + gust * 1.6);
      for (let s = 0; s < rd.h; s++) {
        const f = s / rd.h;
        const rx = rd.x + (rd.lean + sway) * f * f;
        const ry = rd.y - s;
        set(rx, ry, s > rd.h - 3 ? C(0x4a4238) : INK);
      }
    }

    // 8. Swaying Gnarled Sakura Tree Trunk, Branches, Uguisu Birds & Blossom Canopy
    const branchSway = Math.sin(t * 0.65) * 1.2;
    for (let i = 0; i < trunkPixels.length; i++) {
      const tp = trunkPixels[i];
      const sx = tp.x + Math.round(branchSway * tp.w * 0.45);
      const sy = tp.y + Math.round(branchSway * tp.w * 0.25);
      set(sx, sy, tp.c);
    }

    // Pair of Uguisu (Japanese Bush Warblers) hopping on the sakura branch
    for (let i = 0; i < warblers.length; i++) {
      const wb = warblers[i];
      wb.noteTimer -= dt;
      if (wb.noteTimer <= 0) {
        wb.noteTimer = 3.2 + rnd() * 2.5;
        wb.dir = -wb.dir;
        notes.push({ x: wb.bx + wb.dir * 2, y: wb.by - 4, a: 0, c: i === 0 ? C(0xf2b8c6) : C(0xffe098) });
      }
      const hopY = Math.sin(t * 6 + i * 2) > 0.82 ? -1 : 0;
      const wx = wb.bx + Math.round(branchSway * 0.2), wy = wb.by + hopY;
      // Olive-green warbler back, cream belly, tail & beak
      set(wx, wy, C(0x6e8446));
      set(wx + wb.dir, wy - 1, C(0x7c9450));
      set(wx, wy + 1, C(0xe6dec8));
      set(wx - wb.dir, wy, C(0x4c5c30));
      set(wx + wb.dir * 2, wy - 1, INK);
    }
    notes = notes.filter(n => (n.a += dt) < 1.6);
    for (const n of notes) {
      const nx = Math.round(n.x + Math.sin(n.a * 4) * 1.5);
      const ny = Math.round(n.y - n.a * 5.5);
      set(nx, ny, n.c);
      set(nx + 1, ny - 1, n.c);
      set(nx + 1, ny, n.c);
    }

    // Swaying Sakura Blossom Clusters
    for (let i = 0; i < blossomClusters.length; i++) {
      const cl = blossomClusters[i];
      const dxSway = Math.round(Math.sin(t * 0.8 + cl.ph) * (0.6 + gust * 1.1) * cl.w);
      const dySway = Math.round(Math.cos(t * 0.9 + cl.ph) * 0.6 * cl.w);
      const pts = cl.pts;
      for (let p = 0; p < pts.length; p++) {
        set(cl.cx + pts[p].dx + dxSway, cl.cy + pts[p].dy + dySway, pts[p].c);
      }
    }

    // 9. Glitch-Free Drifting Sakura Petals (Updated Incrementally via Clamped `dt`)
    const windBoost = 1.0 + gust * 0.85;
    for (let i = 0; i < petals.length; i++) {
      const p = petals[i];
      p.x += (p.vx * windBoost + Math.cos(t * p.swFreq + p.ph) * p.swAmp) * dt;
      p.y += (p.vy + Math.sin(t * p.swFreq * 0.8 + p.ph) * 1.4) * dt;

      // Seamless wrap around screen bounds
      if (p.y > H + 6) {
        p.y = -4;
        p.x = rnd() * W * 0.85;
      }
      if (p.x > W + 6) p.x -= W + 10;
      if (p.x < -6) p.x += W + 10;

      const px0 = Math.round(p.x), py0 = Math.round(p.y);
      set(px0, py0, p.c);
      // 3D tumbling flutter animation (alternates between 1px and 2px/3px petal shapes)
      const flutter = Math.sin(t * p.spin + p.ph);
      if (p.sz === 2 && flutter > -0.2) {
        set(px0 + (flutter > 0.4 ? 1 : 0), py0 + (flutter < 0.4 ? 1 : 0), C(0xfcf2f4));
      }
    }

    // 10. Traditional Vermilion Hanko Seal Stamp in Bottom-Right Corner
    drawHankoSeal();

    // 11. Hanging Scroll Washi Dither-Dissolve Reveal Intro (Click/Tap Canvas to Replay)
    if (revealProgress < 1) {
      for (let i = 0; i < W * H; i++) {
        const k = ikey[i];
        if (k > revealProgress) {
          px[i] = PAPER;
        } else if (k > revealProgress - 0.035) {
          px[i] = C(0xd89aa8);
        }
      }
    }

    ctx.putImageData(img, 0, 0);
  }

  // Precompute scroll-unroll dither reveal threshold map
  const ikey = new Float32Array(W * H);
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      ikey[y * W + x] = hash(x + 7, y + 13) * 0.55 + (y / H) * 0.45;
    }
  }

  // Clamped Delta-Time Loop + Visibility Reset (Eliminates Background-Tab Hurricane Glitch)
  const INTRO_MS = 3200;
  let t0 = performance.now();
  let lastFrame = 0;
  let prevTime = performance.now();
  let simTime = 0;

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      prevTime = performance.now();
      lastFrame = 0;
    }
  });

  cv.addEventListener('pointerdown', () => {
    t0 = performance.now();
  });

  function loop(now) {
    requestAnimationFrame(loop);
    if (now - lastFrame < 33) return; // Crisp ~30fps pixel-art cadence
    lastFrame = now;

    // Strictly clamp dt to max 40ms so background tab throttling never causes a speed spike
    const dt = Math.min(0.04, Math.max(0.001, (now - prevTime) / 1000));
    prevTime = now;
    simTime += dt;

    const e = Math.min(1, (now - t0) / INTRO_MS);
    const revealProgress = e >= 1 ? 1 : (1 - Math.pow(1 - e, 2)) * 1.04;

    render(simTime, dt, revealProgress);
  }

  requestAnimationFrame(loop);
})();
</script>
