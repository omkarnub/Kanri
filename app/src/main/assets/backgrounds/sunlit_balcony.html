    * {

      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #080a0f;
      pointer-events: none;
    }
    #ambientBackdrop {
      position: fixed;
      inset: -10%;
      background: radial-gradient(
        circle at 50% 42%,
        rgba(var(--glow-r), var(--glow-g), var(--glow-b), 0.36) 0%,
        rgba(var(--glow-r), var(--glow-g), var(--glow-b), 0.14) 45%,

      );
      filter: blur(48px);
      pointer-events: none;
      z-index: 0;
      transition: background 0.3s ease;
    }
    #stageWrapper {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1;
      pointer-events: none;
    }
    #frameContainer {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: #0d111a;
      pointer-events: none;
    }
    #displayCanvas {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
      pointer-events: none;
    }
</style>

      function initParticles() {
        // Floating ambient dust motes catching the moving sunbeam
        for (let i = 0; i < 48; i++) {
          dustParticles.push({
            x: 10 + Math.random() * 160,
            y: 40 + Math.random() * 265,
            vx: (Math.random() - 0.5) * 0.12,
            vy: -0.06 + (Math.random() - 0.5) * 0.08,

          const c = k % 8;
          const imgD = tmpCtx.getImageData(c * PW, r * PH, PW, PH);

        {

          intMult: [1.0, 1.0, 1.0], intBias: [0, 0, 0],
          beamMult: [1.0, 1.0, 1.0], beamBaseIdx: 8.0,

        },
        {
          hour: 10.5,
          extMult: [1.02, 1.02, 1.0], extBias: [2, 2, 0],
          intMult: [1.01, 1.01, 1.0], intBias: [1, 1, 0],
          beamMult: [1.02, 1.02, 0.98], beamBaseIdx: 16.0,
          autoLamp: 0.0, glowRGB: [230, 215, 160]
        },
        {
          hour: 12.75,
          extMult: [1.06, 1.08, 1.05], extBias: [6, 8, 6],
          intMult: [1.04, 1.06, 1.04], intBias: [5, 6, 5],
          beamMult: [1.05, 1.05, 1.02], beamBaseIdx: 22.0,
          autoLamp: 0.0, glowRGB: [240, 235, 195]
        },
        {
          hour: 15.5,
          extMult: [1.02, 0.96, 0.80], extBias: [8, 2, -6],
          intMult: [0.98, 0.92, 0.78], intBias: [6, 1, -4],
          beamMult: [1.16, 0.96, 0.70], beamBaseIdx: 26.0,
          autoLamp: 0.0, glowRGB: [240, 185, 110]
        },
        {
          hour: 18.0,
          extMult: [0.92, 0.58, 0.42], extBias: [16, -6, -12],
          intMult: [0.70, 0.46, 0.50], intBias: [8, -4, 4],
          beamMult: [1.40, 0.62, 0.22], beamBaseIdx: 29.5,
          autoLamp: 0.30, glowRGB: [235, 95, 48]
        },
        {
          hour: 19.75,
          extMult: [0.30, 0.38, 0.64], extBias: [-2, 3, 14],
          intMult: [0.34, 0.38, 0.56], intBias: [0, 2, 8],
          beamMult: [0.08, 0.12, 0.24], beamBaseIdx: 30.0,
          autoLamp: 0.70, glowRGB: [60, 75, 145]
        },
        {
          hour: 21.5,
          extMult: [0.18, 0.26, 0.50], extBias: [-3, 1, 12],
          intMult: [0.22, 0.28, 0.52], intBias: [-1, 2, 8],
          beamMult: [0.15, 0.26, 0.54], beamBaseIdx: 15.0,
          autoLamp: 0.50, glowRGB: [40, 60, 120]
        },
        {
          hour: 24.0,
          extMult: [0.15, 0.22, 0.45], extBias: [-4, 0, 10],
          intMult: [0.18, 0.25, 0.48], intBias: [-2, 2, 8],
          beamMult: [0.16, 0.28, 0.58], beamBaseIdx: 12.0,
          autoLamp: 0.40, glowRGB: [32, 48, 95]
        }
      ];

      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function lerp3(a, b, t) {
        return [
          a[0] + (b[0] - a[0]) * t,
          a[1] + (b[1] - a[1]) * t,
          a[2] + (b[2] - a[2]) * t
        ];
      }

      function getCycleParams(hour) {
        const h = ((hour % 24) + 24) % 24;
        let i = 0;
        while (i < DAY_ANCHORS.length - 2 && h >= DAY_ANCHORS[i + 1].hour) {
          i++;
        }
        const a0 = DAY_ANCHORS[i];
        const a1 = DAY_ANCHORS[i + 1];
        const span = Math.max(0.0001, a1.hour - a0.hour);
        const rawT = Math.max(0.0, Math.min(1.0, (h - a0.hour) / span));
        const t = rawT * rawT * (3.0 - 2.0 * rawT);

        return {
          extMult: lerp3(a0.extMult, a1.extMult, t),
          extBias: lerp3(a0.extBias, a1.extBias, t),
          intMult: lerp3(a0.intMult, a1.intMult, t),
          intBias: lerp3(a0.intBias, a1.intBias, t),
          beamMult: lerp3(a0.beamMult, a1.beamMult, t),
          beamBaseIdx: lerp(a0.beamBaseIdx, a1.beamBaseIdx, rawT),
          autoLamp: lerp(a0.autoLamp, a1.autoLamp, t),
          glowRGB: lerp3(a0.glowRGB, a1.glowRGB, t)
        };
      }

      function blendPixel(x, y, r, g, b, alpha) {
        const ix = Math.floor(x);
        const iy = Math.floor(y);
        if (ix < 0 || ix >= PW || iy < 0 || iy >= PH) return;
        const p4 = (iy * PW + ix) * 4;
        const inv = 1.0 - alpha;
        outBuf[p4]     = Math.min(255, Math.max(0, outBuf[p4] * inv + r * alpha));
        outBuf[p4 + 1] = Math.min(255, Math.max(0, outBuf[p4 + 1] * inv + g * alpha));
        outBuf[p4 + 2] = Math.min(255, Math.max(0, outBuf[p4 + 2] * inv + b * alpha));
      }

      function renderScene(dt, nowMs) {
        if (!state.ready || !tileAmb || keyframes.length < 31) return;

        // Advance continuous 24-hour cycle & 25s video loop clock
        state.origLoopSec = (state.origLoopSec + dt) % 25.0;
        const nowTime = new Date(); state.hour = nowTime.getHours() + nowTime.getMinutes() / 60 + nowTime.getSeconds() / 3600;

        // Update time display badge
        const curH = Math.floor(state.hour);
        const curM = Math.floor((state.hour - curH) * 60);
        

        const params = getCycleParams(state.hour);
        const extM = params.extMult;
        const extB = params.extBias;
        const intM = params.intMult;
        const intB = params.intBias;
        const beamM = params.beamMult;
        const lampStrength = params.autoLamp;

        document.documentElement.style.setProperty('--glow-r', Math.round(params.glowRGB[0]));
        document.documentElement.style.setProperty('--glow-g', Math.round(params.glowRGB[1]));
        document.documentElement.style.setProperty('--glow-b', Math.round(params.glowRGB[2]));

        // Calculate smooth keyframe index u across daytime sun traversal
        let u;
        if (state.hour >= 7.0 && state.hour <= 18.0) {
          // Sun travels smoothly through keyframes across the day
          const dayProgress = (state.hour - 7.0) / (18.0 - 7.0);
          u = dayProgress * 30.0;
        } else {
          // Soft wave modulation at twilight and night
          const wave = Math.sin((state.origLoopSec / 25.0) * Math.PI * 2) * 2.5;
          u = Math.max(0.0, Math.min(30.0, params.beamBaseIdx + wave));
        }

        const k0 = Math.max(0, Math.min(30, Math.floor(u)));
        const k1 = Math.max(0, Math.min(30, k0 + 1));
        const frac = u - k0;
        const invFrac = 1.0 - frac;
        const frameA = keyframes[k0];
        const frameB = keyframes[k1];

        const extMR = extM[0], extMG = extM[1], extMB = extM[2];
        const extBR = extB[0], extBG = extB[1], extBB = extB[2];
        const intMR = intM[0], intMG = intM[1], intMB = intM[2];
        const intBR = intB[0], intBG = intB[1], intBB = intB[2];
        const bmR = beamM[0], bmG = beamM[1], bmB = beamM[2];

        for (let i = 0; i < NUM_PIXELS; i++) {
          const p4 = i * 4;
          const curR = frameA[p4]     * invFrac + frameB[p4]     * frac;
          const curG = frameA[p4 + 1] * invFrac + frameB[p4 + 1] * frac;
          const curB = frameA[p4 + 2] * invFrac + frameB[p4 + 2] * frac;

          const ambR = tileAmb[p4];
          const ambG = tileAmb[p4 + 1];
          const ambB = tileAmb[p4 + 2];

          const dirR = curR > ambR ? curR - ambR : 0.0;
          const dirG = curG > ambG ? curG - ambG : 0.0;
          const dirB = curB > ambB ? curB - ambB : 0.0;

          let r, g, b;
          if (extMask[i] > 0.5) {
            // Balcony outdoor foliage and sky
            r = ambR * extMR + extBR + dirR * bmR * 0.75;
            g = ambG * extMG + extBG + dirG * bmG * 0.75;
            b = ambB * extMB + extBB + dirB * bmB * 0.75;
          } else {
            // Interior room, rug, and hardwood floorboards
            r = ambR * intMR + intBR + dirR * bmR;
            g = ambG * intMG + intBG + dirG * bmG;
            b = ambB * intMB + intBB + dirB * bmB;

            // Warm interior incandescent lamp
            if (lampStrength > 0.01) {
              const lm = lampMask[i] * lampStrength;
              r += lm * (62.0 + ambR * 0.36);
              g += lm * (35.0 + ambG * 0.18);
              b += lm * (10.0 + ambB * 0.05);
            }
          }

          outBuf[p4]     = r < 0 ? 0 : (r > 255 ? 255 : r);
          outBuf[p4 + 1] = g < 0 ? 0 : (g > 255 ? 255 : g);
          outBuf[p4 + 2] = b < 0 ? 0 : (b > 255 ? 255 : b);
          outBuf[p4 + 3] = 255;
        }

        const h = state.hour;
        const tSec = nowMs * 0.001;

        // 1. Floating Sunlit / Moonlit Dust Motes
        for (let i = 0; i < dustParticles.length; i++) {
          const dp = dustParticles[i];
          dp.x += (dp.vx + Math.sin(tSec * 0.8 + dp.phase) * 0.04) * (dt * 30.0);
          dp.y += dp.vy * (dt * 30.0);
          if (dp.y < 15) dp.y = 300;
          if (dp.y > 305) dp.y = 15;
          if (dp.x < 5) dp.x = 172;
          if (dp.x > 174) dp.x = 6;

          const ix = Math.floor(dp.x);
          const iy = Math.floor(dp.y);
          const idx = iy * PW + ix;
          if (extMask[idx] < 0.5) {
            const p4 = idx * 4;
            const curLuma = frameA[p4] * invFrac + frameB[p4] * frac;
            const ambLuma = tileAmb[p4];
            const beamDiff = curLuma - ambLuma;
            if (beamDiff > 16) {
              const twinkle = 0.5 + 0.5 * Math.sin(tSec * 3.5 + dp.phase);
              const a = Math.min(0.68, (beamDiff / 130.0) * twinkle * 0.60);
              blendPixel(ix, iy, Math.min(255, 245 * bmR), Math.min(255, 230 * bmG), Math.min(255, 195 * bmB), a);
            }
          }
        }

        // 2. Night Stars & Fireflies outside balcony
        const nightFactor = (h >= 19.5 || h <= 5.25)
          ? (h >= 19.5 ? Math.min(1.0, (h - 19.5) / 1.5) : Math.min(1.0, (5.25 - h) / 1.5))
          : 0.0;

        if (nightFactor > 0.02) {
          // Stars in outdoor sky canopy
          for (let i = 0; i < stars.length; i++) {
            const st = stars[i];
            const idx = st.y * PW + st.x;
            if (skyCanopyMask[idx] > 0.5) {
              const tw = 0.35 + 0.65 * Math.pow(0.5 + 0.5 * Math.sin(tSec * 2.4 + st.phase), 2.0);
              blendPixel(st.x, st.y, 235, 245, 255, nightFactor * tw * 0.82);
            }
          }

          // Fireflies in outdoor greenery
          for (let i = 0; i < fireflies.length; i++) {
            const ff = fireflies[i];
            ff.x += (ff.vx + Math.sin(tSec * 1.5 + ff.phase) * 0.08) * (dt * 30.0);
            ff.y += (ff.vy + Math.cos(tSec * 1.3 + ff.phase) * 0.06) * (dt * 30.0);
            if (ff.x < 53) ff.x = 146;
            if (ff.x > 147) ff.x = 54;
            if (ff.y < 15) ff.y = 168;
            if (ff.y > 170) ff.y = 16;

            const ix = Math.floor(ff.x);
            const iy = Math.floor(ff.y);
            if (extMask[iy * PW + ix] > 0.5) {
              const pulse = Math.max(0.0, Math.sin(tSec * 2.8 + ff.phase));
              const glowA = nightFactor * Math.pow(pulse, 2.2) * 0.90;
              if (glowA > 0.05) {
                blendPixel(ix, iy, 215, 255, 110, glowA);
                blendPixel(ix + 1, iy, 160, 230, 80, glowA * 0.35);
                blendPixel(ix - 1, iy, 160, 230, 80, glowA * 0.35);
              }
            }
          }
        }

        // 3. Morning Mist at Dawn
        if (h >= 4.5 && h <= 6.75) {
          const mistFactor = Math.sin(((h - 4.5) / 2.25) * Math.PI) * 0.28;
          for (let y = 60; y < 165; y++) {
            const band = Math.sin((y * 0.12) + tSec * 0.6) * 0.5 + 0.5;
            const rowAlpha = mistFactor * band * (1.0 - Math.abs(y - 110) / 55.0);
            if (rowAlpha > 0.01) {
              for (let x = 51; x <= 148; x++) {
                if (extMask[y * PW + x] > 0.5) {
                  blendPixel(x, y, 228, 215, 238, rowAlpha);
                }
              }
            }
          }
        }

        // Upscale 180x320 pixel buffer 4x to 720x1280 with nearest-neighbor crisp pixels
        bufCtx.putImageData(outImgData, 0, 0);
        dispCtx.imageSmoothingEnabled = false;
        dispCtx.drawImage(bufferCanvas, 0, 0, DISP_W, DISP_H);
      }

      let lastTime = performance.now();
      function animate(now) {
        const dt = Math.min(0.1, Math.max(0.0, (now - lastTime) / 1000.0));
        lastTime = now;
        renderScene(dt, now);
        requestAnimationFrame(animate);
      }

      // Click/tap anywhere on canvas to toggle audio
      displayCanvas.addEventListener('click', function() {
        state.soundEnabled = !state.soundEnabled;
        if (state.soundEnabled) {
          bgMusic.volume = 0.70;
          bgMusic.play().catch(function() {});
          soundIcon.textContent = '🔊';
          soundText.textContent = 'Audio playing';
          audioHint.classList.add('fade');
        } else {
          bgMusic.pause();
          soundIcon.textContent = '🔇';
          soundText.textContent = 'Audio muted';
          audioHint.classList.remove('fade');
        }
      });

      requestAnimationFrame(animate);
    })();
  </script>
