const BAYM=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
function bay(x,y){return (BAYM[y&3][x&3]+.5)/16}
function hash(x,y,s){let h=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(s|0,1103515245);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
function vn(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);const a=hash(xi,yi,s),b=hash(xi+1,yi,s),c=hash(xi,yi+1,s),d=hash(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function mkRng(s){return function(){s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function R(c,x,y,w,h,col){c.fillStyle=col;c.fillRect(x,y,w,h)}
function line(c,x0,y0,x1,y1,col){const n=Math.max(Math.abs(x1-x0),Math.abs(y1-y0),1);c.fillStyle=col;for(let i=0;i<=n;i++)c.fillRect(Math.round(x0+(x1-x0)*i/n),Math.round(y0+(y1-y0)*i/n),1,1)}
function disc(c,cx,cy,r,col){c.fillStyle=col;for(let y=-r;y<=r;y++)for(let x=-r;x<=r;x++)if(x*x+y*y<=r*r+r*.6)c.fillRect(cx+x,cy+y,1,1)}
function pick(pal,v){let i=Math.floor(v*pal.length);return pal[i<0?0:i>=pal.length?pal.length-1:i]}

}

  R(c,x,y,w,h,mortar);

    const ww=Math.min(tw-1,w-i*tw),hh=Math.min(th-1,h-j*th);

}
function winGrid(c,x,y,w,h,cols,rows,frame,gp,seed){
  R(c,x,y,w,h,frame);

function frame(ms){
