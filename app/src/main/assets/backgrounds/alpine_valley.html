  "333333303333303303000003000330030000000003320300333300oo0000033xx0000333333333mm030033033333333332222000333mmmmm000lllll0oo0000oo0000000000000000000000020202020",
  "33333303333303303300000300030000000300300300300333300000000003303000003000000mmmm300003333000000000222333333mmm2200kllll0000nn0000000000000000000000000002020002",
  "33333033333033333000000300000000303300333000003333333333000333333000033330000mmmm0000003333330000000222330000002200kklll0000oon000000000000000000000000000202000",
  "33333333333333333033000330000333033000333000003333oo3330000oo33300003333330000mm0003323000003300222222233302222222llkkk000o00o0000000000000000000000000000020000",
  "33333333333333333330000333033333333003333000033333o3300000ooo0300003333333330000003333220000033000222222333000022kkllkk000oo000000000000000000000000000000000000"
];

    const GW = 160;
    const GH = 256;
    const SCALE = 5; // 160*5 = 800, 256*5 = 1280

    const PALETTE_RGB = PALETTE_HEX.map(hex => [
      parseInt(hex.slice(1, 3), 16),
      parseInt(hex.slice(3, 5), 16),
      parseInt(hex.slice(5, 7), 16)
    ]);

    const baseGrid = new Array(GH);
    for (let y = 0; y < GH; y++) {
      const row = new Uint8Array(GW);
      const str = ROWS_B36[y];
      for (let x = 0; x < GW; x++) {
        row[x] = parseInt(str.charCodeAt(x) <= 57
          ? str[x]
          : String(str.charCodeAt(x) - 87), 10);
      }
      baseGrid[y] = row;
    }

    const frameGrid = new Array(GH);
    for (let y = 0; y < GH; y++) {
      frameGrid[y] = new Uint8Array(GW);
    }

    // =========================================================================
    // 2. SEMANTIC PIXEL REGION EXTRACTION (100% DERIVED FROM EXACT PIXEL GRID)
    // =========================================================================
    const WATER_SET = new Set([9, 16, 34, 13]);
    const ROCK_SET = new Set([18, 25, 27, 29, 31]);
    const FLOWER_SET = new Set([20, 21, 22, 23, 24, 26, 33, 35]);
    const GRASS_BRIGHT_SET = new Set([19, 12, 6]);
    const FOLIAGE_BG_SET = new Set([0, 2, 3, 4, 6, 10, 12]);

    // 2A. River mask, centerline, arc-length, and rock-adjacent splash pixels
    const riverMask = Array.from({ length: GH }, () => new Uint8Array(GW));
    const riverCenterX = new Float32Array(GH);
    const riverWidth = new Float32Array(GH);
    const riverArcS = new Float32Array(GH);
    const rockSplashPixels = [];

    let prevCx = 100;
    let accumArc = 0;
    for (let y = 128; y <= 225; y++) {
      let sumX = 0;
      let count = 0;
      for (let x = 0; x < GW; x++) {
        if (WATER_SET.has(baseGrid[y][x])) {
          riverMask[y][x] = 1;
          sumX += x;
          count++;
        }
      }
      if (count > 0) {
        const cx = sumX / count;
        if (y > 128) {
          accumArc += Math.hypot(cx - prevCx, 1);
        }
        riverCenterX[y] = cx;
        riverWidth[y] = count;
        riverArcS[y] = accumArc;
        prevCx = cx;
      }
    }

    for (let y = 130; y <= 224; y++) {
      for (let x = 1; x < GW - 1; x++) {
        if (!riverMask[y][x]) continue;
        let touchesRock = false;
        for (let dy = -1; dy <= 1; dy++) {
          for (let dx = -1; dx <= 1; dx++) {
            if (ROCK_SET.has(baseGrid[y + dy][x + dx])) {
              touchesRock = true;
            }
          }
        }
        if (touchesRock) {
          rockSplashPixels.push({ x, y, orig: baseGrid[y][x] });
        }
      }
    }

    // 2B. 8-connected Wildflower Clusters
    const visitedFlower = Array.from({ length: GH }, () => new Uint8Array(GW));
    const flowerClusters = [];

    function findNearestFoliageBg(x, y, dirX) {
      for (let step = 1; step <= 5; step++) {
        const nx = x + dirX * step;
        if (nx >= 0 && nx < GW) {
          const c = baseGrid[y][nx];
          if (FOLIAGE_BG_SET.has(c)) return c;
        }
      }
      if (y > 0 && FOLIAGE_BG_SET.has(baseGrid[y - 1][x])) return baseGrid[y - 1][x];
      if (y < GH - 1 && FOLIAGE_BG_SET.has(baseGrid[y + 1][x])) return baseGrid[y + 1][x];
      return y > 195 ? 3 : 6;
    }

    for (let y = 165; y < GH; y++) {
      for (let x = 0; x < GW; x++) {
        if (FLOWER_SET.has(baseGrid[y][x]) && !visitedFlower[y][x]) {
          const queue = [[x, y]];
          visitedFlower[y][x] = 1;
          const pixels = [];
          let sumX = 0;
          let sumY = 0;

          while (queue.length > 0) {
            const [cx, cy] = queue.pop();
            const color = baseGrid[cy][cx];
            const leftBg = findNearestFoliageBg(cx, cy, -1);
            const rightBg = findNearestFoliageBg(cx, cy, +1);
            pixels.push({ x: cx, y: cy, color, leftBg, rightBg });
            sumX += cx;
            sumY += cy;

            for (let dy = -1; dy <= 1; dy++) {
              for (let dx = -1; dx <= 1; dx++) {
                if (dx === 0 && dy === 0) continue;
                const nx = cx + dx;
                const ny = cy + dy;
                if (nx >= 0 && nx < GW && ny >= 165 && ny < GH) {
                  if (FLOWER_SET.has(baseGrid[ny][nx]) && !visitedFlower[ny][nx]) {
                    visitedFlower[ny][nx] = 1;
                    queue.push([nx, ny]);
                  }
                }
              }
            }
          }

          const meanX = sumX / pixels.length;
          const meanY = sumY / pixels.length;
          const phase = (meanX * 0.13 + meanY * 0.09) % (Math.PI * 2);
          flowerClusters.push({ cx: meanX, cy: meanY, phase, pixels });
        }
      }
    }

    // 2C. Sunlit Hillside Grass Tufts & Foreground Bush Leaf Tips
    const grassTips = [];
    for (let y = 135; y < GH; y++) {
      for (let x = 1; x < GW - 2; x++) {
        if (riverMask[y][x] || FLOWER_SET.has(baseGrid[y][x])) continue;
        const c = baseGrid[y][x];
        const cRight = baseGrid[y][x + 1];
        const cLeft = baseGrid[y][x - 1];

        if (
          GRASS_BRIGHT_SET.has(c) &&
          !riverMask[y][x + 1] &&
          !FLOWER_SET.has(cRight) &&
          cRight !== c &&
          FOLIAGE_BG_SET.has(cRight)
        ) {
          grassTips.push({ x, y, color: c, rightBg: cRight, leftBg: FOLIAGE_BG_SET.has(cLeft) ? cLeft : cRight, kind: 'grass' });
        } else if (
          y >= 182 &&
          (c === 3 || c === 0) &&
          !riverMask[y][x + 1] &&
          !FLOWER_SET.has(cRight) &&
          cRight !== c &&
          (cRight === 0 || cRight === 2 || cRight === 6 || cRight === 12)
        ) {
          grassTips.push({ x, y, color: c, rightBg: cRight, leftBg: FOLIAGE_BG_SET.has(cLeft) ? cLeft : c, kind: 'bush' });
        }
      }
    }

    // 2D. Pine Forest & Valley Tree Crown Tips
    const treeTips = [];
    for (let y = 64; y <= 172; y++) {
      for (let x = 1; x < GW - 2; x++) {
        const c = baseGrid[y][x];
        const cRight = baseGrid[y][x + 1];
        if (
          (c === 3 || c === 10 || c === 0) &&
          (cRight === 2 || cRight === 4 || cRight === 6) &&
          !riverMask[y][x + 1]
        ) {
          treeTips.push({ x, y, color: c });
        }
      }
    }

    // 2E. Alpine Mountain Snow Glints
    const snowGlints = [];
    for (let y = 21; y <= 100; y++) {
      for (let x = 2; x < GW - 2; x++) {
        const c = baseGrid[y][x];
        if (c === 14 || c === 17) {
          if (
            baseGrid[y][x - 1] === 13 ||
            baseGrid[y][x + 1] === 13 ||
            baseGrid[y - 1][x] === 13
          ) {
            snowGlints.push({ x, y, orig: c });
          }
        }
      }
    }

    // 2F. Ambient On-Grid Pixel Petals/Pollen & Distant Alpine Swifts
    const ambientPetals = [
      { baseX: 18, baseY: 194, color: 21, speedX: 4.2, speedY: -1.1, ampY: 2.5, phase: 0.2 },
      { baseX: 34, baseY: 205, color: 19, speedX: 5.0, speedY: -0.8, ampY: 2.0, phase: 1.4 },
      { baseX: 52, baseY: 218, color: 21, speedX: 3.8, speedY: -1.3, ampY: 2.8, phase: 2.7 },
      { baseX: 25, baseY: 228, color: 23, speedX: 4.6, speedY: -0.9, ampY: 2.2, phase: 3.9 },
      { baseX: 68, baseY: 232, color: 21, speedX: 4.1, speedY: -1.2, ampY: 2.4, phase: 5.1 },
      { baseX: 86, baseY: 242, color: 19, speedX: 3.9, speedY: -1.0, ampY: 1.9, phase: 0.9 },
      { baseX: 45, baseY: 186, color: 23, speedX: 4.8, speedY: -0.7, ampY: 2.1, phase: 2.1 },
      { baseX: 14, baseY: 176, color: 21, speedX: 3.5, speedY: -0.6, ampY: 1.8, phase: 4.4 }
    ];

    const alpineBirds = [
      { baseY: 62, speedX: 5.2, ampY: 1.8, flapSpeed: 6.5, phase: 0.0 },
      { baseY: 68, speedX: 4.7, ampY: 1.5, flapSpeed: 6.0, phase: 2.2 }
    ];

    // =========================================================================
    // 3. CANVAS SETUP & EYE-SOOTHING CONTINUOUS LOOP
    // =========================================================================
    const canvas = document.getElementById('pixelCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    ctx.imageSmoothingEnabled = false;

    const offCanvas = document.createElement('canvas');
    offCanvas.width = GW;
    offCanvas.height = GH;
    const offCtx = offCanvas.getContext('2d', { alpha: false });
    const imgData = offCtx.createImageData(GW, GH);
    const rgbaBuf = imgData.data;

    function buildFrame(t) {
      for (let y = 0; y < GH; y++) {
        frameGrid[y].set(baseGrid[y]);
      }

      // Layer 1: Gentle Sky Horizon Shimmer & Mountain Snow Glints
      const ditherRows = [28, 30, 32, 33, 34, 35, 37, 39];
      for (let r = 0; r < ditherRows.length; r++) {
        const y = ditherRows[r];
        for (let x = 0; x < GW; x++) {
          const orig = baseGrid[y][x];
          if (orig !== 1 && orig !== 15) continue;
          const shimmer = Math.sin(x * 0.11 - t * 1.8 + y * 0.45);
          if (shimmer > 0.72) {
            const srcX = x > 0 && (baseGrid[y][x - 1] === 1 || baseGrid[y][x - 1] === 15) ? x - 1 : x;
            frameGrid[y][x] = baseGrid[y][srcX];
          }
        }
      }

      for (let i = 0; i < snowGlints.length; i++) {
        const sg = snowGlints[i];
        const glint = Math.sin(sg.x * 0.21 - sg.y * 0.17 - t * 2.1 + (i % 7) * 0.9);
        if (glint > 0.87) {
          frameGrid[sg.y][sg.x] = 13;
        }
      }

      // Layer 2: Flowing Alpine River, Rapids & Rock Lapping
      for (let y = 128; y <= 225; y++) {
        const cx = riverCenterX[y];
        const rw = Math.max(4, riverWidth[y]);
        const arc = riverArcS[y];

        for (let x = 68; x < GW; x++) {
          if (!riverMask[y][x]) continue;

          const latWave = Math.sin(y * 0.26 - t * 4.4 + x * 0.09);
          const vertWave = Math.cos(y * 0.20 - t * 3.6 + x * 0.06);
          const dx = Math.round(latWave * 1.25);
          const dy = Math.round(vertWave * 0.75);

          const sx = x - dx;
          const sy = y - dy;
          let c = baseGrid[y][x];

          if (sy >= 128 && sy <= 225 && sx >= 0 && sx < GW && riverMask[sy][sx]) {
            c = baseGrid[sy][sx];
          } else if (sx >= 0 && sx < GW && riverMask[y][sx]) {
            c = baseGrid[y][sx];
          }

          const u = (x - cx) / rw;
          const streamPhase = arc * 0.40 - t * 6.0 + Math.cos(u * 4.2) * 1.3;
          const streamVal = Math.sin(streamPhase);
          const rippleVal = Math.sin(arc * 0.58 - t * 7.8 + x * 0.33);

          if (c === 9) {
            if (streamVal > 0.80 && Math.abs(u) < 0.40) {
              c = 16;
            } else if (streamVal > 0.70 && Math.abs(u) < 0.44) {
              c = 34;
            }
          } else if (c === 16) {
            if (rippleVal > 0.82 && (baseGrid[y][Math.max(0, x - 1)] === 13 || baseGrid[y][Math.min(GW - 1, x + 1)] === 13 || streamVal > 0.75)) {
              c = 13;
            } else if (streamVal < -0.82) {
              c = 9;
            }
          } else if (c === 13) {
            const isEdgeFoam =
              (x > 0 && baseGrid[y][x - 1] !== 13) ||
              (x < GW - 1 && baseGrid[y][x + 1] !== 13);
            if (isEdgeFoam && rippleVal < -0.58) {
              c = 16;
            }
          }

          frameGrid[y][x] = c;
        }
      }

      for (let i = 0; i < rockSplashPixels.length; i++) {
        const rp = rockSplashPixels[i];
        const lap = Math.sin(rp.x * 0.65 + rp.y * 0.45 - t * 6.8 + i * 0.7);
        if (lap > 0.76) {
          frameGrid[rp.y][rp.x] = 13;
        } else if (lap > 0.48 && frameGrid[rp.y][rp.x] === 9) {
          frameGrid[rp.y][rp.x] = 16;
        }
      }

      // Layer 3: Pine Forest, Sunlit Grass Waves & Swaying Wildflower Clusters
      for (let i = 0; i < treeTips.length; i++) {
        const tt = treeTips[i];
        const breeze = Math.sin(tt.x * 0.08 + tt.y * 0.06 - t * 2.8 + (i % 5) * 0.4);
        if (breeze > 0.68) {
          frameGrid[tt.y][tt.x + 1] = tt.color;
        }
      }

      for (let i = 0; i < grassTips.length; i++) {
        const gt = grassTips[i];
        const wind =
          Math.sin(gt.x * 0.075 + gt.y * 0.052 - t * 3.5) +
          0.35 * Math.sin(gt.x * 0.14 - gt.y * 0.04 - t * 2.1);

        if (wind > 0.62) {
          if (!FLOWER_SET.has(frameGrid[gt.y][gt.x + 1]) && !riverMask[gt.y][gt.x + 1]) {
            frameGrid[gt.y][gt.x + 1] = gt.color;
            frameGrid[gt.y][gt.x] = gt.leftBg;
          }
        } else if (wind < -0.78 && gt.kind === 'bush') {
          if (gt.x > 0 && !FLOWER_SET.has(frameGrid[gt.y][gt.x - 1]) && !riverMask[gt.y][gt.x - 1]) {
            frameGrid[gt.y][gt.x - 1] = gt.color;
            frameGrid[gt.y][gt.x] = gt.rightBg;
          }
        }
      }

      for (let i = 0; i < flowerClusters.length; i++) {
        const fc = flowerClusters[i];
        const gust =
          Math.sin(fc.cx * 0.072 + fc.cy * 0.048 - t * 3.4 + fc.phase * 0.35) +
          0.3 * Math.cos(fc.cx * 0.05 - t * 2.0);

        let dx = 0;
        if (gust > 0.56) {
          dx = 1;
        } else if (gust < -0.72) {
          dx = -1;
        }

        if (dx !== 0) {
          for (let p = 0; p < fc.pixels.length; p++) {
            const px = fc.pixels[p];
            frameGrid[px.y][px.x] = dx > 0 ? px.leftBg : px.rightBg;
          }
          for (let p = 0; p < fc.pixels.length; p++) {
            const px = fc.pixels[p];
            const nx = px.x + dx;
            if (nx >= 0 && nx < GW && !riverMask[px.y][nx]) {
              frameGrid[px.y][nx] = px.color;
            } else {
              frameGrid[px.y][px.x] = px.color;
            }
          }
        }
      }

      // Layer 4: Ambient Pixel Petals, Pollen & Distant Alpine Swifts
      for (let i = 0; i < ambientPetals.length; i++) {
        const pt = ambientPetals[i];
        const cycle = (t * 0.55 + pt.phase) % 6.0;
        if (cycle < 4.8) {
          const px = Math.round(pt.baseX + cycle * pt.speedX + Math.sin(cycle * 2.4 + pt.phase) * 1.8);
          const py = Math.round(pt.baseY + cycle * pt.speedY + Math.cos(cycle * 3.1 + pt.phase) * pt.ampY);
          if (px >= 1 && px < GW - 1 && py >= 150 && py < GH - 1) {
            frameGrid[py][px] = pt.color;
          }
        }
      }

      for (let i = 0; i < alpineBirds.length; i++) {
        const b = alpineBirds[i];
        const bx = Math.round(((t * b.speedX + b.phase * 18) % (GW + 45)) - 20);
        const by = Math.round(b.baseY + Math.sin(t * 1.4 + b.phase) * b.ampY);
        const flap = Math.sin(t * b.flapSpeed + b.phase);

        if (bx >= 2 && bx < GW - 3 && by >= 25 && by <= 105) {
          const wingY = flap > 0.2 ? by - 1 : (flap < -0.3 ? by + 1 : by);
          frameGrid[by][bx] = 11;
          if (wingY >= 0 && wingY < GH) {
            frameGrid[wingY][bx - 1] = 5;
            frameGrid[wingY][bx + 1] = 5;
          }
        }
      }
    }

    function renderGridToCanvas() {
      let ptr = 0;
      for (let y = 0; y < GH; y++) {
        const row = frameGrid[y];
        for (let x = 0; x < GW; x++) {
          const rgb = PALETTE_RGB[row[x]];
          rgbaBuf[ptr++] = rgb[0];
          rgbaBuf[ptr++] = rgb[1];
          rgbaBuf[ptr++] = rgb[2];
          rgbaBuf[ptr++] = 255;
        }
      }
      offCtx.putImageData(imgData, 0, 0);
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(offCanvas, 0, 0, GW * SCALE, GH * SCALE);
    }

    // Eye-soothing, relaxed time scale (0.42x)
    const SOOTHING_SPEED = 0.42;
    let simTime = 0;
    let lastTimestamp = performance.now();

    function loop(now) {
      const dt = Math.min(0.1, (now - lastTimestamp) / 1000);
      lastTimestamp = now;
      simTime += dt * SOOTHING_SPEED;

      buildFrame(simTime);
      renderGridToCanvas();
      requestAnimationFrame(loop);
    }

    buildFrame(0);
    renderGridToCanvas();
    requestAnimationFrame(loop);
  </script>
