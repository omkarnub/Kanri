    /* lantern windows */
    for (let k = 0; k < lanI.length; k++) {
      const i = lanI[k], c = base32[i], fl = lanLight(t, lanSide[k]), m = 0.78 + 0.34 * fl;
      const r = Math.min(255, (c & 255) * m), g = Math.min(255, ((c >> 8) & 255) * m), b = Math.min(255, ((c >> 16) & 255) * (0.9 + 0.1 * fl));
      f32[i] = ((255 << 24) | ((b | 0) << 16) | ((g | 0) << 8) | (r | 0)) >>> 0;
    }
    /* mist: the painted cloud bank flows sideways inside its own outline */
    for (let n = 0; n < mN; n++) {
      const y = MY[n];
      const dx = Math.round(2.6 * Math.sin(t * 0.42 + y * 0.05) + 1.4 * Math.sin(t * 0.77 + y * 0.12 + 1.3));
      if (dx === 0) continue;
      const sx = MX[n] - dx;
      if (sx < 0 || sx >= W) continue;
      const j = MI[n] - dx;
      if (flag[j] === 8) f32[MI[n]] = base32[j];
    }
    fgCtx.putImageData(frame, 0, 0);

    /* backdrop: the painting's own sky, scrolled in a seamless loop */
    const off = Math.floor(t * 3.2) % Lw;
    ctx.drawImage(skyImg, -off, 0);
    ctx.drawImage(skyImg, Lw - off, 0);
    ctx.drawImage(skyImg, 2 * Lw - off, 0);
    ctx.fillStyle = '#27455f';
    for (const b of birds) {
      const span = W + 70, x = Math.floor(W + 30 - (((t * b.sp + b.off) % span) + span) % span), y = Math.floor(b.y0 + Math.sin(t * 0.8 + b.ph) * 2.5);
      for (const [dx, dy] of BIRD[Math.floor(t * 4 + b.ph) & 3]) ctx.fillRect(x + dx, y + dy, 1, 1);
    }
    /* painting */
    ctx.drawImage(fgCv, 0, 0);

    /* light shafts */
    ctx.fillStyle = '#fff1c8';
    [[-40, 14, 0.07], [10, 8, 0.055], [62, 16, 0.045], [118, 9, 0.04]].forEach(([x0, w, a], i) => {
      ctx.globalAlpha = a * (0.55 + 0.45 * Math.sin(t * 0.45 + i * 1.9));
      for (let y = 0; y < 340; y++) ctx.fillRect(Math.round(x0 + y * 0.46), y, w, 1);
    });
    ctx.globalAlpha = 1;

    /* lantern glow, star, snow sparkles */
    glow(85, OY + 255, 9, 0.5 + 0.18 * lanLight(t, 0), '#ffd9a0');
    glow(187, OY + 257, 9, 0.5 + 0.18 * lanLight(t, 1), '#ffd9a0');
    const sp = 0.5 + 0.5 * Math.sin(t * 2.4);
    ctx.fillStyle = '#ffffff';
    const sx = 133, sy = OY + 272, arm = 1 + Math.round(sp * 3);
    ctx.fillRect(sx, sy, 1, 1);
    for (let k = 1; k <= arm; k++) { ctx.fillRect(sx - k, sy, 1, 1); ctx.fillRect(sx + k, sy, 1, 1); ctx.fillRect(sx, sy - k, 1, 1); ctx.fillRect(sx, sy + k, 1, 1); }
    for (const s of sparkles) {
      const ph = (t / s.per + s.ph) % 1;
      if (ph < 0.12) {
        const x = s.x, y = s.y; ctx.fillRect(x, y, 1, 1);
        if (ph > 0.03 && ph < 0.09) { ctx.fillRect(x - 1, y, 1, 1); ctx.fillRect(x + 1, y, 1, 1); ctx.fillRect(x, y - 1, 1, 1); ctx.fillRect(x, y + 1, 1, 1); }
      }
    }
    /* petals, leaves, dust in the sunlit path */
    for (const p of parts) {
      const [x, y, ph] = partPos(p, t);
      if (ph < 0.04 || ph > 0.96 || y > H) continue;
      ctx.fillStyle = p.col; ctx.fillRect(Math.floor(x), Math.floor(y), p.big ? 2 : 1, p.big ? 2 : 1);
    }
    ctx.fillStyle = '#fff3d6';
    for (const m of motes) {
      const a = Math.sin(t * m.sp * 2 + m.ph);
      if (a < 0.1) continue;
      ctx.fillRect(Math.floor(m.x + Math.sin(t * 0.3 * m.sp + m.ph) * 6), Math.floor(m.y - ((t * m.sp * 2 + m.ph * 3) % 30)), 1, 1);
    }
    /* soft edge falloff where the painting was extended to 9:16 */
    ctx.fillStyle = '#0a1522';
    for (let k = 0; k < 40; k++) {
      ctx.globalAlpha = 0.3 * (1 - k / 40) * (1 - k / 40);
      ctx.fillRect(0, k, W, 1); ctx.fillRect(0, H - 1 - k, W, 1);
    }
    ctx.globalAlpha = 1;
  }

  const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { render(2); return; }
  const t0 = performance.now();
  let last = 0;
  const loop = ms => {
    if (ms - last >= 40) { last = ms; render((ms - t0) / 1000 + 2); }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}
})();

</script>
